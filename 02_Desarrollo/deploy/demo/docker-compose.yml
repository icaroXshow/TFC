services:
  mariadb:
    image: mariadb:11.4
    container_name: kwl_demo_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: demo
      MARIADB_DATABASE: kwl_lavanderia
    ports:
      - "3307:3306"
    volumes:
      - kwl_demo_db:/var/lib/mysql
      - ../../context/db/BD_modelo_fisico.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/init/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  redis:
    image: redis:7-alpine
    container_name: kwl_demo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: kwl_demo_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"

  mqtt-sim:
    build:
      context: ../../simulation
      dockerfile: Dockerfile
    container_name: kwl_demo_mqtt_sim
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://mqtt:1883
      SIM_CYCLE_SECONDS: 90
    depends_on:
      - mqtt

  core-node:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    container_name: kwl_demo_core_node
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ORIGIN: http://127.0.0.1:8081,http://localhost:8081,http://127.0.0.1:8080,null,*
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: demo
      DB_NAME: kwl_lavanderia
      AUTH_TOKEN_SECRET: kwl-backend-super-secret-2024
      MQTT_ENABLED: "true"
      MQTT_URL: mqtt://mqtt:1883
      CAMERA_BASE_URL: http://es1034.c14.ovh:1055
      CAMERA_USER: api
      CAMERA_PASS: XJ2Ugh32rVHvCqXZtu9pOSaujSyl5ynM4SP1
      CAMERA2_BASE_URL: http://es1034.c14.ovh:1055
      CAMERA2_USER: api
      CAMERA2_PASS: XJ2Ugh32rVHvCqXZtu9pOSaujSyl5ynM4SP1
    depends_on:
      - mariadb
      - redis
      - mqtt

  core-nginx:
    image: nginx:1.27-alpine
    container_name: kwl_demo_core_nginx
    restart: unless-stopped
    depends_on:
      - core-node
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../app/frontend/public:/usr/share/nginx/html:ro

  adminer:
    image: adminer:4
    container_name: kwl_demo_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - mariadb

volumes:
  kwl_demo_db:

services:
  mariadb:
    image: mariadb:11.4
    container_name: kwl_demo_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-demo}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-kwl_lavanderia}
    ports:
      - "3307:3306"
    volumes:
      - kwl_demo_db:/var/lib/mysql
      - ../../context/db/BD_modelo_fisico.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/init/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: kwl_demo_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: kwl_demo_mqtt
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"

  mqtt-sim:
    build:
      context: ../../simulation
      dockerfile: Dockerfile
    container_name: kwl_demo_mqtt_sim
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://mqtt:1883
      SIM_CYCLE_SECONDS: ${SIM_CYCLE_SECONDS:-2400}
      SIM_START_MIN_CREDIT: ${SIM_START_MIN_CREDIT:-4}
      SIM_MACHINE_CODES: ${SIM_MACHINE_CODES:-L1,L2,L3,S1,S2}
      SIM_LAV_IDS: ${SIM_LAV_IDS:-3}
    depends_on:
      - mqtt

  mqtt-sim-gui:
    build:
      context: ../../simulation
      dockerfile: Dockerfile
    container_name: kwl_demo_mqtt_sim_gui
    restart: unless-stopped
    command: ["npm", "run", "start:gui"]
    environment:
      MQTT_URL: mqtt://mqtt:1883
      SIM_MACHINE_CODES: ${SIM_MACHINE_CODES:-L1,L2,L3,S1,S2}
      SIM_LAV_ID: ${SIM_LAV_ID:-3}
      SIM_GUI_PORT: ${SIM_GUI_PORT:-8090}
    ports:
      - "8083:${SIM_GUI_PORT:-8090}"
    depends_on:
      - mqtt

  core-node:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    container_name: kwl_demo_core_node
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ORIGIN: http://127.0.0.1:8081,http://localhost:8081,http://127.0.0.1:8080,null
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-demo}
      DB_NAME: kwl_lavanderia
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-kwl-demo-cambiar-esta-clave-en-produccion-32chars}
      MQTT_ENABLED: "true"
      MQTT_URL: mqtt://mqtt:1883
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-500}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-kwl}
      CAMERA_BASE_URL: ${CAMERA_BASE_URL:-}
      CAMERA_USER: ${CAMERA_USER:-}
      CAMERA_PASS: ${CAMERA_PASS:-}
      CAMERA_STREAM_USER: ${CAMERA_STREAM_USER:-}
      CAMERA_STREAM_PASS: ${CAMERA_STREAM_PASS:-}
      CAMERA2_BASE_URL: ${CAMERA2_BASE_URL:-}
      CAMERA2_USER: ${CAMERA2_USER:-}
      CAMERA2_PASS: ${CAMERA2_PASS:-}
      CAMERA2_STREAM_USER: ${CAMERA2_STREAM_USER:-}
      CAMERA2_STREAM_PASS: ${CAMERA2_STREAM_PASS:-}
    depends_on:
      mariadb:
        condition: service_started
      redis:
        condition: service_started
      mqtt:
        condition: service_started

  core-nginx:
    image: nginx:1.27-alpine
    container_name: kwl_demo_core_nginx
    restart: unless-stopped
    depends_on:
      - core-node
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../app/frontend/public:/usr/share/nginx/html:ro

  adminer:
    image: adminer:4
    container_name: kwl_demo_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - mariadb

volumes:
  kwl_demo_db:

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KWL · Simulador IoT</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/simulador.js"></script>
  </head>
  <body>
    <main class="contenedor" aria-label="Panel del simulador IoT">
      <section class="columna-izquierda">
        <p
          id="pistaSimulacion"
          class="mensaje-operacion"
          role="status"
          aria-live="polite"
        ></p>

        <section class="seccion-maquinas" aria-labelledby="tituloMaquinas">
          <div class="seccion-titulo">
            <div>
              <p class="etiqueta">Máquinas</p>
              <h2 id="tituloMaquinas">Panel de máquinas</h2>
            </div>
            <p class="ayuda">
              Crédito, arranque, estado y temporizador de cada una.
            </p>
          </div>
          <div class="cuadricula-maquinas" id="panelGrid"></div>
        </section>
      </section>

      <aside class="columna-derecha">
        <header class="cabecera">
          <section class="marca" aria-labelledby="tituloSimulador">
            <div class="marca-icono" aria-hidden="true">KWL</div>
            <div>
              <p class="etiqueta">Simulador Test</p>
              <h1 id="tituloSimulador">SIMULADOR</h1>
              <p class="subtitulo">Entorno aislado para pruebas</p>
            </div>
          </section>
          <section class="estado-global" aria-label="Estado de conexión">
            <div
              id="indicadorMqtt"
              class="insignia estado-malo"
              role="status"
              aria-live="polite"
            >
              MQTT: OFF
            </div>
            <div
              id="indicadorRedis"
              class="insignia estado-malo"
              role="status"
              aria-live="polite"
            >
              Redis: OFF
            </div>
            <div class="ultima-lectura">
              Última lectura<br />
              <strong id="ultimaLectura">--:--:--</strong>
            </div>
          </section>
        </header>

        <section class="panel-alertas" aria-labelledby="tituloAlarmas">
          <div class="panel-alertas-cabecera">
            <div>
              <p class="etiqueta">Monitorización</p>
              <h2 id="tituloAlarmas">Eventos</h2>
            </div>
            <button
              id="limpiarAlarmas"
              class="boton boton-secundario"
              type="button"
            >
              Limpiar
            </button>
          </div>
          <ol id="listaAlarmas" class="lista-alarmas" aria-live="polite">
            <li class="alarma-vacia">Nada por ahora</li>
          </ol>
        </section>
      </aside>
    </main>

    <div
      id="contenedorTostadas"
      class="contenedor-tostadas"
      aria-live="polite"
      aria-label="Notificaciones"
    ></div>
  </body>
</html>

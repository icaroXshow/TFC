<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cámara· Admin · KWL Aqua</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  <link rel="stylesheet" href="../css/admin/base.css?v=33" />
  <link rel="stylesheet" href="../css/componentes/componentes-principales.css?v=33" />
  <link rel="stylesheet" href="../css/componentes/componentes-responsive.css?v=33" />
  <link rel="stylesheet" href="../css/admin/estructura-paneles.css?v=33" />
  <link rel="stylesheet" href="../css/admin/vistas-admin.css?v=33" />
  <link rel="stylesheet" href="../css/admin/responsive-admin.css?v=33" />
  </head>

  <body data-breadcrumb="Domótica|Cámara">
    <div class="diseno-admin" id="adminApp">
      <aside class="barra-lateral-admin" aria-label="Menú lateral">
        <div class="marca-admin">
          <img src="/assets/Logo_KWL.png" alt="KWL Aqua" class="marca-admin-logo" />
          <div class="marca-admin-text">
            <strong>KWL Aqua</strong>
            <span>Panel admin</span>
          </div>
        </div>

        <nav class="navegacion-admin" aria-label="Navegación">
          <a class="item-navegacion-admin" data-nav="inicio" href="/admin/inicio.html">Inicio</a>

          <div class="grupo-navegacion-admin">Domótica</div>
          <a class="item-navegacion-admin" data-nav="maquinas" href="/admin/maquinas.html">Máquinas</a>
          <a class="item-navegacion-admin" data-nav="iot" href="/admin/iot.html">Programador</a>
          <a class="item-navegacion-admin" data-nav="camara" href="/admin/camara.html">Cámara</a>

          <div class="grupo-navegacion-admin">Contabilidad</div>
          <a class="item-navegacion-admin" data-nav="caja" href="/admin/caja.html">Caja</a>
          <a class="item-navegacion-admin" data-nav="informes" href="/admin/informes.html">Informes</a>

          <div class="grupo-navegacion-admin">Gestión</div>
          <a class="item-navegacion-admin" data-nav="usuarios" href="/admin/usuarios.html">Usuarios</a>
          <a class="item-navegacion-admin" data-nav="logs" href="/admin/logs.html">Logs</a>
          <a class="item-navegacion-admin" data-nav="editor-web" href="/admin/editor-web.html">Editor Web</a>
          <a class="item-navegacion-admin" data-nav="ajustes" href="/admin/ajustes.html">Ajustes</a>
        </nav>

        <div class="barra-lateral-admin-bottom">
          <a class="cierre-sesion-admin" id="adminLogout" href="/index.html">Cerrar sesión</a>
        </div>
      </aside>

      <header class="barra-superior-admin">
        <button class="boton-menu-admin" type="button" id="adminBurger" aria-label="Abrir menú">☰</button>
        <div class="migas-admin" id="adminBreadcrumbs"></div>
        <div class="barra-superior-admin-right">
          <select class="selector-lavanderia-admin" id="adminLavSelect" aria-label="Lavandería activa"></select>
          <span class="ubicacion-admin" id="adminLocation">—</span>
        </div>
      </header>

      <main class="principal-admin">
        <section class="seccion-admin" style="margin-top: 2px">
          <div class="acciones-iot" style="flex-wrap: wrap">
            <button type="button" class="boton-primario" id="camOpenMobotix">Mobotix</button>
            <button type="button" class="boton-secundario" id="camOpenAdmin">Administrar</button>
            <button type="button" class="boton-secundario" id="camOpenEvents">Eventos</button>
          </div>
        </section>
        <section class="seccion-admin" style="margin-top: 10px">
          <div class="cabecera-seccion-admin">
            <h3>Cámara</h3>
            <p></p>
          </div>

          <article class="tarjeta-admin admin-camera-card">
            <p class="titulo-tarjeta-admin">Vista en directo</p>
            <div class="rejilla-camaras-admin">
              <section class="panel-camara-admin" id="panelCamara1">
                <p class="pista-tarjeta-admin">Principal</p>
                <div class="admin-camera-frame">
                  <img class="admin-camera-img" id="cameraStream1" alt="Cámara 1" loading="lazy" />
                </div>
                <div class="acciones-iot" style="margin-top: 8px; flex-wrap: wrap">
                  <button type="button" class="boton-primario" id="camDetach1">Desprender</button>
                  <button type="button" class="boton-secundario" id="camCenter1">Centrar</button>
                  <button type="button" class="boton-secundario" id="camZoomIn1">Zoom +</button>
                  <button type="button" class="boton-secundario" id="camZoomOut1">Zoom -</button>
                  <select class="entrada" id="camDisplayMode1" style="max-width: 220px">
                    <option value="fullimage">Full Image</option>
                    <option value="surround" selected>Surround</option>
                    <option value="panorama">Panorama</option>
                  </select>
                  <button type="button" class="boton-secundario" id="camDisplayApply1">Aplicar modo</button>
                </div>
              </section>

              <section class="panel-camara-admin" id="panelCamara2">
                <p class="pista-tarjeta-admin">Adicional</p>
                <div class="admin-camera-frame">
                  <img class="admin-camera-img" id="cameraStream2" alt="Cámara 2" loading="lazy" />
                </div>
                <div class="acciones-iot" style="margin-top: 8px; flex-wrap: wrap">
                  <button type="button" class="boton-primario" id="camDetach2">Desprender</button>
                  <button type="button" class="boton-secundario" id="camCenter2">Centrar</button>
                  <button type="button" class="boton-secundario" id="camZoomIn2">Zoom +</button>
                  <button type="button" class="boton-secundario" id="camZoomOut2">Zoom -</button>
                  <select class="entrada" id="camDisplayMode2" style="max-width: 220px">
                    <option value="fullimage">Full Image</option>
                    <option value="surround" selected>Surround</option>
                    <option value="panorama">Panorama</option>
                  </select>
                  <button type="button" class="boton-secundario" id="camDisplayApply2">Aplicar modo</button>
                </div>
              </section>
            </div>
            <p class="pista-tarjeta-admin" id="cameraHint"></p>
          </article>
        </section>
      </main>
    </div>
    <script src="../js/admin.js?v=52"></script>
  </body>
</html>

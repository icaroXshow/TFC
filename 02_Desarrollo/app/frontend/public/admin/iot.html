<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luz / Puerta · Admin · KWL Aqua</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/componentes.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>

  <body data-breadcrumb="Domótica|Programador">
    <div class="admin-layout" id="adminApp">
      <aside class="admin-sidebar" aria-label="Menú lateral">
        <div class="admin-brand">
          <img src="/assets/Logo_KWL.png" alt="KWL Aqua" class="admin-brand-logo" />
          <div class="admin-brand-text">
            <strong>KWL Aqua</strong>
            <span>Panel admin</span>
          </div>
        </div>

        <nav class="admin-nav" aria-label="Navegación">
          <a class="admin-nav-item" data-nav="inicio" href="/admin/inicio.html">Inicio</a>

          <div class="admin-nav-group">Domótica</div>
          <a class="admin-nav-item" data-nav="maquinas" href="/admin/maquinas.html">Máquinas</a>
          <a class="admin-nav-item" data-nav="iot" href="/admin/iot.html">Programador</a>
          <a class="admin-nav-item" data-nav="camara" href="/admin/camara.html">Cámara web</a>

          <div class="admin-nav-group">Contabilidad</div>
          <a class="admin-nav-item" data-nav="caja" href="/admin/caja.html">Caja</a>
          <a class="admin-nav-item" data-nav="informes" href="/admin/informes.html">Informes</a>

          <div class="admin-nav-group">Gestión</div>
          <a class="admin-nav-item" data-nav="usuarios" href="/admin/usuarios.html">Usuarios</a>
          <a class="admin-nav-item" data-nav="logs" href="/admin/logs.html">Logs</a>
        </nav>

        <div class="admin-sidebar-bottom">
          <a class="admin-logout" id="adminLogout" href="/index.html">Cerrar sesión</a>
        </div>
      </aside>

      <header class="admin-topbar">
        <button class="admin-burger" type="button" id="adminBurger" aria-label="Abrir menú">☰</button>
        <div class="admin-breadcrumbs" id="adminBreadcrumbs"></div>
        <div class="admin-topbar-right">
          <select class="admin-lav-select" id="adminLavSelect" aria-label="Lavandería activa"></select>
          <span class="admin-location" id="adminLocation">—</span>
        </div>
      </header>

      <main class="admin-main">
        <section class="admin-section">
          <div class="admin-section-head">
            <h3>Programador</h3>
            <p>Puerta, luces y ventilación (manual + horarios).</p>
          </div>

          <div class="iot-grid">
            <article class="iot-tile">
              <h4>Puerta</h4>
              <p class="iot-status">Estado: <span id="iotDoorState" class="iot-state-pill">—</span></p>
              <div class="iot-actions">
                <button type="button" class="btn-primary" id="doorOpen">Abrir</button>
                <button type="button" class="btn-secondary" id="doorClose">Cerrar</button>
              </div>
              <div class="iot-schedule">
                <label>Auto abrir <input type="time" class="input" id="doorOn" /></label>
                <label>Auto cerrar <input type="time" class="input" id="doorOff" /></label>
              </div>
            </article>
            <article class="iot-tile">
              <h4>Luces</h4>
              <p class="iot-status">Estado: <span id="iotLightsState" class="iot-state-pill">—</span></p>
              <div class="iot-actions">
                <button type="button" class="btn-primary" id="lightsOn">Encender</button>
                <button type="button" class="btn-secondary" id="lightsOff">Apagar</button>
              </div>
              <div class="iot-schedule">
                <label>Auto encender <input type="time" class="input" id="lightsOnTime" /></label>
                <label>Auto apagar <input type="time" class="input" id="lightsOffTime" /></label>
              </div>
            </article>
            <article class="iot-tile">
              <h4>Ventilación</h4>
              <p class="iot-status">Estado: <span id="iotFanState" class="iot-state-pill">—</span></p>
              <div class="iot-actions">
                <button type="button" class="btn-primary" id="fanOn">Encender</button>
                <button type="button" class="btn-secondary" id="fanOff">Apagar</button>
              </div>
              <div class="iot-schedule">
                <label>Auto encender <input type="time" class="input" id="fanOnTime" /></label>
                <label>Auto apagar <input type="time" class="input" id="fanOffTime" /></label>
              </div>
            </article>
          </div>

          <div class="iot-footer">
            <button type="button" class="btn-primary" id="iotSaveSchedule">Guardar horarios</button>
            <span class="iot-hint" id="iotHint" aria-live="polite"></span>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>

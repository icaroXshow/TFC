<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios · Admin · KWL Aqua</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/componentes.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>

  <body data-breadcrumb="Gestión|Usuarios">
    <div class="admin-layout" id="adminApp">
      <aside class="admin-sidebar" aria-label="Menú lateral">
        <div class="admin-brand">
          <img src="/assets/Logo_KWL.png" alt="KWL Aqua" class="admin-brand-logo" />
          <div class="admin-brand-text">
            <strong>KWL Aqua</strong>
            <span>Panel admin</span>
          </div>
        </div>

        <nav class="admin-nav" aria-label="Navegación">
          <a class="admin-nav-item" data-nav="inicio" href="/admin/inicio.html">Inicio</a>

          <div class="admin-nav-group">Domótica</div>
          <a class="admin-nav-item" data-nav="maquinas" href="/admin/maquinas.html">Máquinas</a>
          <a class="admin-nav-item" data-nav="iot" href="/admin/iot.html">Programador</a>
          <a class="admin-nav-item" data-nav="camara" href="/admin/camara.html">Cámara</a>

          <div class="admin-nav-group">Contabilidad</div>
          <a class="admin-nav-item" data-nav="caja" href="/admin/caja.html">Caja</a>
          <a class="admin-nav-item" data-nav="informes" href="/admin/informes.html">Informes</a>

          <div class="admin-nav-group">Gestión</div>
          <a class="admin-nav-item" data-nav="usuarios" href="/admin/usuarios.html">Usuarios</a>
          <a class="admin-nav-item" data-nav="logs" href="/admin/logs.html">Logs</a>
        </nav>

        <div class="admin-sidebar-bottom">
          <a class="admin-logout" id="adminLogout" href="/index.html">Cerrar sesión</a>
        </div>
      </aside>

      <header class="admin-topbar">
        <button class="admin-burger" type="button" id="adminBurger" aria-label="Abrir menú">☰</button>
        <div class="admin-breadcrumbs" id="adminBreadcrumbs"></div>
        <div class="admin-topbar-right">
          <select class="admin-lav-select" id="adminLavSelect" aria-label="Lavandería activa"></select>
          <span class="admin-location" id="adminLocation">—</span>
        </div>
      </header>

      <main class="admin-main">
        <section class="admin-section">
          <div class="admin-section-head">
            <h3>Usuarios</h3>
            <p>Gestiona usuarios del panel (solo admin).</p>
          </div>

          <div class="users-toolbar">
            <div class="users-actions">
              <button type="button" class="btn-primary" id="userNewBtn">Nuevo usuario</button>
            </div>
            <div class="users-filters">
              <input
                id="usersSearch"
                class="input"
                type="search"
                placeholder="Buscar por nombre, email o rol…"
                autocomplete="off"
              />
            </div>
          </div>

          <div class="users-table-wrap">
            <table class="users-table" aria-label="Tabla de usuarios">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Email</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th>Último acceso</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="usersTbody"></tbody>
            </table>
          </div>

          <div class="users-note" id="usersNote" hidden></div>
        </section>
      </main>
    </div>

    <dialog class="modal" id="userDialog">
      <form method="dialog" class="modal-card" id="userForm">
        <div class="modal-head">
          <strong id="userDialogTitle">Usuario</strong>
          <button type="button" class="modal-close" id="userDialogClose" aria-label="Cerrar">×</button>
        </div>

        <div class="modal-body">
          <div class="form-grid">
            <label class="field">
              <span>Nombre</span>
              <input class="input" id="userNombre" required />
            </label>
            <label class="field">
              <span>Apellidos</span>
              <input class="input" id="userApellidos" />
            </label>
            <label class="field">
              <span>Email</span>
              <input class="input" id="userEmail" type="email" required />
            </label>
            <label class="field">
              <span>Rol</span>
              <select class="input" id="userRol" required>
                <option value="OPERADOR">OPERADOR</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </label>
            <label class="field">
              <span>Nueva contraseña (opcional)</span>
              <input class="input" id="userPassword" type="password" autocomplete="new-password" />
            </label>
          </div>
          <div class="inline-alert" id="userTempPassword" hidden></div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn-secondary" id="userCancelBtn">Cancelar</button>
          <button type="submit" class="btn-primary" id="userSaveBtn">Guardar</button>
        </div>
      </form>
    </dialog>

    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios · Admin · KWL Aqua</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  <link rel="stylesheet" href="../css/admin/base.css?v=33" />
  <link rel="stylesheet" href="../css/componentes/componentes-principales.css?v=31" />
  <link rel="stylesheet" href="../css/componentes/componentes-responsive.css?v=31" />
  <link rel="stylesheet" href="../css/admin/estructura-paneles.css?v=31" />
  <link rel="stylesheet" href="../css/admin/vistas-admin.css?v=31" />
  <link rel="stylesheet" href="../css/admin/responsive-admin.css?v=31" />
  </head>

  <body data-breadcrumb="Gestión|Usuarios">
    <div class="diseno-admin" id="adminApp">
      <aside class="barra-lateral-admin" aria-label="Menú lateral">
        <div class="marca-admin">
          <img src="/assets/Logo_KWL.png" alt="KWL Aqua" class="marca-admin-logo" />
          <div class="marca-admin-text">
            <strong>KWL Aqua</strong>
            <span>Panel admin</span>
          </div>
        </div>

        <nav class="navegacion-admin" aria-label="Navegación">
          <a class="item-navegacion-admin" data-nav="inicio" href="/admin/inicio.html">Inicio</a>

          <div class="grupo-navegacion-admin">Domótica</div>
          <a class="item-navegacion-admin" data-nav="maquinas" href="/admin/maquinas.html">Máquinas</a>
          <a class="item-navegacion-admin" data-nav="iot" href="/admin/iot.html">Programador</a>
          <a class="item-navegacion-admin" data-nav="camara" href="/admin/camara.html">Cámara</a>

          <div class="grupo-navegacion-admin">Contabilidad</div>
          <a class="item-navegacion-admin" data-nav="caja" href="/admin/caja.html">Caja</a>
          <a class="item-navegacion-admin" data-nav="informes" href="/admin/informes.html">Informes</a>

          <div class="grupo-navegacion-admin">Gestión</div>
          <a class="item-navegacion-admin" data-nav="usuarios" href="/admin/usuarios.html">Usuarios</a>
          <a class="item-navegacion-admin" data-nav="logs" href="/admin/logs.html">Logs</a>
          <a class="item-navegacion-admin" data-nav="editor-web" href="/admin/editor-web.html">Editor Web</a>
          <a class="item-navegacion-admin" data-nav="ajustes" href="/admin/ajustes.html">Ajustes</a>
        </nav>

        <div class="barra-lateral-admin-bottom">
          <a class="cierre-sesion-admin" id="adminLogout" href="/index.html">Cerrar sesión</a>
        </div>
      </aside>

      <header class="barra-superior-admin">
        <button class="boton-menu-admin" type="button" id="adminBurger" aria-label="Abrir menú">☰</button>
        <div class="migas-admin" id="adminBreadcrumbs"></div>
        <div class="barra-superior-admin-right">
          <select class="selector-lavanderia-admin" id="adminLavSelect" aria-label="Lavandería activa"></select>
          <span class="ubicacion-admin" id="adminLocation">—</span>
        </div>
      </header>

      <main class="principal-admin">
        <section class="seccion-admin">
          <div class="cabecera-seccion-admin">
            <h3>Usuarios</h3>
            <p>Administración de usuarios y permisos del panel.</p>
          </div>

          <div class="barra-usuarios">
            <div class="users-actions">
              <button type="button" class="boton-primario" id="userNewBtn">Nuevo usuario</button>
            </div>
            <div class="filtros-usuarios">
              <input
                id="usersSearch"
                class="entrada"
                type="search"
                placeholder="Buscar por nombre, email o rol…"
                autocomplete="off"
              />
            </div>
          </div>

          <div class="contenedor-tabla-usuarios">
            <table class="tabla-usuarios" aria-label="Tabla de usuarios">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Email</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th>Último acceso</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="usersTbody"></tbody>
            </table>
          </div>

          <div class="nota-usuarios" id="usersNote" hidden></div>
        </section>
      </main>
    </div>

    <dialog class="modal" id="userDialog">
      <form method="dialog" class="modal-card" id="userForm">
        <div class="modal-head">
          <strong id="userDialogTitle">Usuario</strong>
          <button type="button" class="modal-close" id="userDialogClose" aria-label="Cerrar">×</button>
        </div>

        <div class="modal-body">
          <div class="form-grid">
            <label class="field">
              <span>Nombre</span>
              <input class="entrada" id="userNombre" required />
            </label>
            <label class="field">
              <span>Apellidos</span>
              <input class="entrada" id="userApellidos" />
            </label>
            <label class="field">
              <span>Email</span>
              <input class="entrada" id="userEmail" type="email" required />
            </label>
            <label class="field">
              <span>Rol</span>
              <select class="entrada" id="userRol" required>
                <option value="OPERADOR">OPERADOR</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </label>
            <label class="field">
              <span>Nueva contraseña (opcional)</span>
              <input class="entrada" id="userPassword" type="password" autocomplete="new-password" />
            </label>
          </div>
          <div class="inline-alert" id="userTempPassword" hidden></div>
        </div>

        <div class="modal-foot">
          <button type="button" class="boton-secundario" id="userCancelBtn">Cancelar</button>
          <button type="submit" class="boton-primario" id="userSaveBtn">Guardar</button>
        </div>
      </form>
    </dialog>
    <script src="../js/admin.js?v=40"></script>
  </body>
</html>

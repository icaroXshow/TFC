<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajustes · Admin · KWL Aqua</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin/base.css?v=33" />
  <link rel="stylesheet" href="../css/componentes/componentes-principales.css?v=33" />
  <link rel="stylesheet" href="../css/componentes/componentes-responsive.css?v=33" />
  <link rel="stylesheet" href="../css/admin/estructura-paneles.css?v=33" />
  <link rel="stylesheet" href="../css/admin/vistas-admin.css?v=33" />
  <link rel="stylesheet" href="../css/admin/responsive-admin.css?v=33" />
  </head>
  <body data-breadcrumb="Gestión|Ajustes">
    <div class="diseno-admin" id="adminApp">
      <aside class="barra-lateral-admin" aria-label="Menú lateral">
        <div class="marca-admin">
          <img src="/assets/Logo_KWL.png" alt="KWL Aqua" class="marca-admin-logo" />
          <div class="marca-admin-text"><strong>KWL Aqua</strong><span>Panel admin</span></div>
        </div>
        <nav class="navegacion-admin" aria-label="Navegación">
          <a class="item-navegacion-admin" data-nav="inicio" href="/admin/inicio.html">Inicio</a>
          <div class="grupo-navegacion-admin">Domótica</div>
          <a class="item-navegacion-admin" data-nav="maquinas" href="/admin/maquinas.html">Máquinas</a>
          <a class="item-navegacion-admin" data-nav="iot" href="/admin/iot.html">Programador</a>
          <a class="item-navegacion-admin" data-nav="camara" href="/admin/camara.html">Cámara</a>
          <div class="grupo-navegacion-admin">Contabilidad</div>
          <a class="item-navegacion-admin" data-nav="caja" href="/admin/caja.html">Caja</a>
          <a class="item-navegacion-admin" data-nav="informes" href="/admin/informes.html">Informes</a>
          <div class="grupo-navegacion-admin">Gestión</div>
          <a class="item-navegacion-admin" data-nav="usuarios" href="/admin/usuarios.html">Usuarios</a>
          <a class="item-navegacion-admin" data-nav="logs" href="/admin/logs.html">Logs</a>
          <a class="item-navegacion-admin" data-nav="editor-web" href="/admin/editor-web.html">Editor Web</a>
          <a class="item-navegacion-admin" data-nav="ajustes" href="/admin/ajustes.html">Ajustes</a>
        </nav>
        <div class="barra-lateral-admin-bottom"><a class="cierre-sesion-admin" id="adminLogout" href="/index.html">Cerrar sesión</a></div>
      </aside>
      <header class="barra-superior-admin">
        <button class="boton-menu-admin" type="button" id="adminBurger" aria-label="Abrir menú">☰</button>
        <div class="migas-admin" id="adminBreadcrumbs"></div>
        <div class="barra-superior-admin-right">
          <select class="selector-lavanderia-admin" id="adminLavSelect" aria-label="Lavandería activa"></select>
          <span class="ubicacion-admin" id="adminLocation">—</span>
        </div>
      </header>
      <main class="principal-admin">
        <section class="seccion-admin">
          <div class="cabecera-seccion-admin">
            <h3>Ajustes</h3>
            <p>Configuración operativa para la tienda seleccionada.</p>
          </div>
          <form class="tarjeta-admin web-editor-form" id="envSettingsForm">
            <details class="web-editor-panel" open>
              <summary>Cámara principal</summary>
              <div class="form-grid">
                <label class="field"><span>CAMERA_BASE_URL</span><input class="entrada" id="envCameraBase" /></label>
                <label class="field"><span>CAMERA_USER</span><input class="entrada" id="envCameraUser" /></label>
                <label class="field"><span>CAMERA_PASS (dejar vacío para mantener)</span><input class="entrada" id="envCameraPass" type="password" /></label>
              </div>
            </details>

            <details class="web-editor-panel" id="panelCamaraAdicional">
              <summary>Cámara adicional (opcional)</summary>
              <div class="form-grid">
                <label class="field"><span>CAMERA2_BASE_URL</span><input class="entrada" id="envCamera2Base" /></label>
                <label class="field"><span>CAMERA2_USER</span><input class="entrada" id="envCamera2User" /></label>
                <label class="field"><span>CAMERA2_PASS (dejar vacío para mantener)</span><input class="entrada" id="envCamera2Pass" type="password" /></label>
              </div>
            </details>

            <details class="web-editor-panel">
              <summary>MQTT</summary>
              <div class="form-grid">
                <label class="field"><span>MQTT_URL</span><input class="entrada" id="envMqttUrl" /></label>
                <label class="field"><span>MQTT_USER</span><input class="entrada" id="envMqttUser" /></label>
                <label class="field"><span>MQTT_PASS (dejar vacío para mantener)</span><input class="entrada" id="envMqttPass" type="password" /></label>
              </div>
            </details>

            <details class="web-editor-panel">
              <summary>Redis</summary>
              <div class="form-grid">
                <label class="field"><span>REDIS_ENABLED</span><select class="entrada" id="envRedisEnabled"><option value="true">true</option><option value="false">false</option></select></label>
                <label class="field"><span>REDIS_HOST</span><input class="entrada" id="envRedisHost" /></label>
                <label class="field"><span>REDIS_PORT</span><input class="entrada" id="envRedisPort" /></label>
                <label class="field"><span>REDIS_PASSWORD (dejar vacío para mantener)</span><input class="entrada" id="envRedisPass" type="password" /></label>
                <label class="field"><span>REDIS_DB</span><input class="entrada" id="envRedisDb" /></label>
                <label class="field"><span>REDIS_TIMEOUT_MS</span><input class="entrada" id="envRedisTimeout" /></label>
                <label class="field"><span>REDIS_KEY_PREFIX</span><input class="entrada" id="envRedisPrefix" /></label>
              </div>
            </details>
            <div><button type="submit" class="boton-primario" id="envSettingsSave">Guardar ajustes</button></div>
          </form>
          <p class="nota-usuarios" id="envSettingsHint" hidden></p>
        </section>
      </main>
    </div>
    <script src="../js/admin.js?v=43"></script>
  </body>
</html>

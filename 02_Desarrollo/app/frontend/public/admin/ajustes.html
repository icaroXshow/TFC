  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin/base.css?v=25" />
  <link rel="stylesheet" href="../css/componentes/componentes-principales.css?v=25" />
  <link rel="stylesheet" href="../css/componentes/componentes-responsive.css?v=25" />
  <link rel="stylesheet" href="../css/admin/estructura-paneles.css?v=25" />
  <link rel="stylesheet" href="../css/admin/vistas-admin.css?v=25" />
  <link rel="stylesheet" href="../css/admin/responsive-admin.css?v=25" />
  </head>
  <body data-breadcrumb="Gestión|Ajustes">
    <div class="admin-layout" id="adminApp">
      <aside class="admin-sidebar" aria-label="Menú lateral">
        <div class="admin-brand">
          <img src="/assets/Logo_KWL.png" alt="KWL Aqua" class="admin-brand-logo" />
          <div class="admin-brand-text"><strong>KWL Aqua</strong><span>Panel admin</span></div>
        </div>
        <nav class="admin-nav" aria-label="Navegación">
          <a class="admin-nav-item" data-nav="inicio" href="/admin/inicio.html">Inicio</a>
          <div class="admin-nav-group">Domótica</div>
          <a class="admin-nav-item" data-nav="maquinas" href="/admin/maquinas.html">Máquinas</a>
          <a class="admin-nav-item" data-nav="iot" href="/admin/iot.html">Programador</a>
          <a class="admin-nav-item" data-nav="camara" href="/admin/camara.html">Cámara</a>
          <div class="admin-nav-group">Contabilidad</div>
          <a class="admin-nav-item" data-nav="caja" href="/admin/caja.html">Caja</a>
          <a class="admin-nav-item" data-nav="informes" href="/admin/informes.html">Informes</a>
          <div class="admin-nav-group">Gestión</div>
          <a class="admin-nav-item" data-nav="usuarios" href="/admin/usuarios.html">Usuarios</a>
          <a class="admin-nav-item" data-nav="logs" href="/admin/logs.html">Logs</a>
          <a class="admin-nav-item" data-nav="editor-web" href="/admin/editor-web.html">Editor Web</a>
          <a class="admin-nav-item" data-nav="ajustes" href="/admin/ajustes.html">Ajustes</a>
        </nav>
        <div class="admin-sidebar-bottom"><a class="admin-logout" id="adminLogout" href="/index.html">Cerrar sesión</a></div>
      </aside>
      <header class="admin-topbar">
        <button class="admin-burger" type="button" id="adminBurger" aria-label="Abrir menú">☰</button>
        <div class="admin-breadcrumbs" id="adminBreadcrumbs"></div>
        <div class="admin-topbar-right">
          <select class="admin-lav-select" id="adminLavSelect" aria-label="Lavandería activa"></select>
          <span class="admin-location" id="adminLocation">—</span>
        </div>
      </header>
      <main class="admin-main">
        <section class="admin-section">
          <div class="admin-section-head">
            <h3>Ajustes</h3>
            <p>Configuración operativa de conexiones y credenciales (persiste en BD y en <code>.env</code>).</p>
          </div>
          <form class="admin-card form-grid" id="envSettingsForm">
            <label class="field"><span>CAMERA_BASE_URL</span><input class="input" id="envCameraBase" /></label>
            <label class="field"><span>CAMERA_USER</span><input class="input" id="envCameraUser" /></label>
            <label class="field"><span>CAMERA_PASS (dejar vacío para mantener)</span><input class="input" id="envCameraPass" type="password" /></label>
            <label class="field"><span>CAMERA_STREAM_USER</span><input class="input" id="envCameraStreamUser" /></label>
            <label class="field"><span>CAMERA_STREAM_PASS (dejar vacío para mantener)</span><input class="input" id="envCameraStreamPass" type="password" /></label>
            <label class="field"><span>CAMERA2_BASE_URL</span><input class="input" id="envCamera2Base" /></label>
            <label class="field"><span>CAMERA2_USER</span><input class="input" id="envCamera2User" /></label>
            <label class="field"><span>CAMERA2_PASS (dejar vacío para mantener)</span><input class="input" id="envCamera2Pass" type="password" /></label>
            <label class="field"><span>CAMERA2_STREAM_USER</span><input class="input" id="envCamera2StreamUser" /></label>
            <label class="field"><span>CAMERA2_STREAM_PASS (dejar vacío para mantener)</span><input class="input" id="envCamera2StreamPass" type="password" /></label>
            <label class="field"><span>MQTT_URL</span><input class="input" id="envMqttUrl" /></label>
            <label class="field"><span>MQTT_USER</span><input class="input" id="envMqttUser" /></label>
            <label class="field"><span>MQTT_PASS (dejar vacío para mantener)</span><input class="input" id="envMqttPass" type="password" /></label>
            <label class="field"><span>REDIS_ENABLED</span><select class="input" id="envRedisEnabled"><option value="true">true</option><option value="false">false</option></select></label>
            <label class="field"><span>REDIS_HOST</span><input class="input" id="envRedisHost" /></label>
            <label class="field"><span>REDIS_PORT</span><input class="input" id="envRedisPort" /></label>
            <label class="field"><span>REDIS_PASSWORD (dejar vacío para mantener)</span><input class="input" id="envRedisPass" type="password" /></label>
            <label class="field"><span>REDIS_DB</span><input class="input" id="envRedisDb" /></label>
            <label class="field"><span>REDIS_TIMEOUT_MS</span><input class="input" id="envRedisTimeout" /></label>
            <label class="field"><span>REDIS_KEY_PREFIX</span><input class="input" id="envRedisPrefix" /></label>
            <div><button type="submit" class="btn-primary" id="envSettingsSave">Guardar ajustes</button></div>
          </form>
          <p class="users-note" id="envSettingsHint" hidden></p>
        </section>
      </main>
    </div>
    <script src="../js/admin.js?v=37"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KWL — Universo Navegable</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
      :root {
        --bg: #02030a;
        --panel: rgba(10, 12, 25, 0.55);
        --panel-b: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --line: rgba(255, 255, 255, 0.18);
        --ring: rgba(120, 160, 255, 0.18);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
      }
      svg {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 10;
        background: var(--panel);
        border: 1px solid var(--panel-b);
        padding: 10px 12px;
        border-radius: 12px;
        color: var(--text);
        backdrop-filter: blur(10px);
        max-width: 720px;
      }
      #title {
        font-weight: 850;
        letter-spacing: 0.2px;
      }
      #crumb {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.25;
      }
      #hint {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.25;
      }
      #actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        cursor: pointer;
        user-select: none;
        padding: 7px 10px;
        border-radius: 10px;
        border: 1px solid var(--panel-b);
        background: rgba(42, 228, 203, 0.35);
        color: var(--text);
        font-size: 12px;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #tooltip {
        position: fixed;
        pointer-events: none;
        z-index: 20;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.68);
        color: white;
        font-size: 12px;
        border: 1px solid var(--panel-b);
        display: none;
        max-width: 560px;
        white-space: pre-line;
      }

      /* minimapa */
      #miniWrap {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        width: 260px;
        height: 180px;
        background: rgba(10, 12, 25, 0.45);
        border: 1px solid var(--panel-b);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        overflow: hidden;
      }
      #miniTitle {
        position: absolute;
        left: 10px;
        top: 8px;
        font-size: 11px;
        color: var(--muted);
        user-select: none;
      }
      #miniSvg {
        width: 100%;
        height: 100%;
      }
      .miniViewport {
        fill: rgba(255, 255, 255, 0.06);
        stroke: rgba(255, 255, 255, 0.35);
        stroke-width: 1.5;
      }
      .miniNode {
        fill: rgba(255, 255, 255, 0.38);
      }
      .miniEdge {
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 1;
      }
      .miniBg {
        fill: rgba(0, 0, 0, 0.05);
      }

      /* mapa */
      .edge {
        stroke: var(--line);
        stroke-width: 2;
      }
      .edge.soft {
        stroke-width: 1.6;
        stroke: rgba(255, 255, 255, 0.14);
      }
      .edgeLabel {
        fill: rgba(255, 255, 255, 0.52);
        font-size: 11px;
        user-select: none;
      }
      .label {
        fill: var(--text);
        font-weight: 760;
        font-size: 13px;
        user-select: none;
        pointer-events: none;
      }
      .sub {
        fill: var(--muted);
        font-size: 11px;
        user-select: none;
        pointer-events: none;
      }

      .ring {
        fill: none;
        stroke: var(--ring);
        stroke-width: 2;
      }
      .nodeHit {
        cursor: pointer;
        fill: transparent;
      }
      .planetStroke {
        fill: rgba(0, 0, 0, 0.1);
        stroke: rgba(255, 255, 255, 0.16);
        stroke-width: 2;
      }
      /* Panel lateral */
      .navPanel {
        position: fixed;
        left: 14px;
        top: 150px;
        width: 300px;
        max-height: calc(100vh - 28px);
        background: rgba(20, 20, 24, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 14px;
        overflow: hidden;
        z-index: 9999;
        color: #e9e9ef;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
      }

      .navHeader {
        padding: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .navTitle {
        font-weight: 700;
        margin-bottom: 10px;
      }
      .navSearch {
        width: 90%;
        padding: 10px 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.25);
        color: inherit;
        outline: none;
      }

      .navList {
        padding: 10px;
        overflow: auto;
        max-height: calc(100vh - 120px);
      }

      .navGroup {
        margin: 10px 0 14px;
      }
      .navGroupTitle {
        font-size: 12px;
        opacity: 0.75;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 6px 6px 8px;
      }

      .navItem {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        user-select: none;
      }
      .navItem:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .navBadge {
        font-size: 11px;
        padding: 2px 6px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        opacity: 0.9;
      }
      .navText {
        font-size: 13px;
        line-height: 1.2;
      }
      .navSub {
        font-size: 11px;
        opacity: 0.7;
        margin-top: 2px;
      }

      .navItem.active {
        outline: 2px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.06);
      }

      /* Auto-ocultar paneles por inactividad */
      #hud, #miniWrap, #navPanel{
        transition: opacity .22s ease, transform .22s ease;
      }
      .ui-hidden{
        opacity: 0;
        pointer-events: none;
      }
      #hud.ui-hidden{ transform: translateY(-10px); }
      #navPanel.ui-hidden{ transform: translateY(-10px); }
      #miniWrap.ui-hidden{ transform: translateY(10px); }

    </style>
  </head>

  <body>
    <div id="hud">
      <div id="title">KWL — Universo Navegable</div>
      <div id="crumb">Ruta: Universo</div>
      <div id="hint">
        Rueda: zoom · Arrastra: mover · Click: entrar/abrir · Shift+Click: abrir
        URL en nueva pestaña · Minimapa: click/arrastrar
      </div>
      <div id="actions">
        <div class="btn" id="btnBack" disabled>← Volver</div>
        <div class="btn" id="btnHome">⌂ Inicio</div>
        <div class="btn" id="btnCenter">◎ Centrar</div>
        <div class="btn" id="btnFit">⤢ Ajustar</div>
        <div class="btn" id="btnToggleLabels">Aa Etiquetas</div>
        <div class="btn" id="btnToggleEdges">— Conexiones</div>
        <div class="btn" id="btnToggleMini">▣ Minimapa</div>
      </div>
    </div>

    <div id="tooltip"></div>

    <div id="miniWrap">
      <div id="miniTitle">Navegador</div>
      <svg id="miniSvg"></svg>
    </div>
    <!-- Panel navegación -->
    <div id="navPanel" class="navPanel">
      <div class="navHeader">
        <div class="navTitle">Índice</div>
        <input
          id="navSearch"
          class="navSearch"
          type="text"
          placeholder="Buscar nodo… (label/id)"
        />
      </div>
      <div id="navList" class="navList"></div>
    </div>
    <svg id="space"></svg>

    <script>
      // ============================================================
      // 1) ICONOS EMBEBIDOS (fallback) + REGISTRO DE IMÁGENES (src)
      // ============================================================
      function svgDataUri(svg) {
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg.trim());
      }
      function iconCircle(label, bg1 = "#6aa7ff", bg2 = "#2b4cff") {
        return svgDataUri(`
        <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
          <defs>
            <radialGradient id="g" cx="35%" cy="30%">
              <stop offset="0%" stop-color="${bg1}"/>
              <stop offset="100%" stop-color="${bg2}"/>
            </radialGradient>
          </defs>
          <circle cx="128" cy="128" r="120" fill="url(#g)"/>
          <circle cx="128" cy="128" r="120" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6"/>
          <text x="128" y="144" text-anchor="middle" font-family="Arial" font-size="44" font-weight="800" fill="rgba(255,255,255,0.92)">${label}</text>
        </svg>
      `);
      }

      // Fallbacks siempre disponibles (no dependen de archivos)
      const ICONS = {
        NET: iconCircle("RED", "#8ad3ff", "#3057ff"),
        SRV: iconCircle("SRV", "#b6ffde", "#2aa184"),
        IOT: iconCircle("IOT", "#ffd7a8", "#ff7a2f"),
        CCTV: iconCircle("CCTV", "#d1c5ff", "#6b5cff"),
        ISP: iconCircle("WAN", "#a6f4ff", "#1f6fff"),
        MTK: iconCircle("MTK", "#b9d4ff", "#2b57ff"),
        SW: iconCircle("SW", "#c7d0ff", "#4b55ff"),
        HOST: iconCircle("HOST", "#d8ffd1", "#1b9f68"),
        PVE: iconCircle("PVE", "#c9fff2", "#27b38a"),
        DEB: iconCircle("DEB", "#ffffff", "#9bb0ff"),
        NGINX: iconCircle("NGX", "#d9ffcf", "#2e9b4a"),
        PHP: iconCircle("PHP", "#e6e0ff", "#6a5cff"),
        DB: iconCircle("DB", "#ffe6b8", "#ff8a1f"),
        REDIS: iconCircle("RDS", "#ffd0d0", "#ff4a4a"),
        PMA: iconCircle("PMA", "#fff0c9", "#ffb11f"),
        MER: iconCircle("MER", "#d6f7ff", "#2d89ff"),
        REL: iconCircle("REL", "#f0f0ff", "#6a5cff"),
        BAK: iconCircle("BAK", "#e8ffe6", "#2aa184"),
        ESP: iconCircle("ESP", "#ffe2c9", "#ff7a2f"),
        DOOR: iconCircle("DR", "#ffe2c9", "#ff7a2f"),
        MOBO: iconCircle("MBX", "#e0dcff", "#6b5cff"),
      };

      // IMAGES: aquí defines UNA VEZ las rutas reales (si existen)
      // Si src falla o no está definido, se usa fallback.
      // Puedes cambiar "assets/map/..." por lo que uses en tu servidor.
      const IMAGES = {
        RED: { src: "assets/map/net.png", fallback: ICONS.NET },
        SERVER: { src: "assets/map/server.png", fallback: ICONS.SRV },
        IOT: { src: "assets/map/iot.png", fallback: ICONS.IOT },
        CCTV: { src: "assets/map/cctv.png", fallback: ICONS.CCTV },

        MOVISTAR: { src: "assets/map/movistar.png", fallback: ICONS.ISP },
        MIKROTIK: { src: "assets/map/mikrotik.png", fallback: ICONS.MTK },
        SWITCH: { src: "assets/map/switch.png", fallback: ICONS.SW },

        PROXMOX: { src: "assets/map/proxmox.png", fallback: ICONS.PVE },
        DEBIAN: { src: "assets/map/ubuntu.png", fallback: ICONS.DEB },

        NGINX: { src: "assets/map/nginx.png", fallback: ICONS.NGINX },
        PHP: { src: "assets/map/php.png", fallback: ICONS.PHP },
        MARIADB: { src: "assets/map/mariadb.png", fallback: ICONS.DB },
        REDIS: { src: "assets/map/redis.png", fallback: ICONS.REDIS },

        PHPMA: { src: "assets/map/phpmyadmin.png", fallback: ICONS.PMA },
        MER: { src: "assets/map/mer.png", fallback: ICONS.MER },
        REL: { src: "assets/map/relational.png", fallback: ICONS.REL },
        BACKUP: { src: "assets/map/backup.png", fallback: ICONS.BAK },

        ESP32: { src: "assets/map/esp32.png", fallback: ICONS.ESP },
        DOOR: { src: "assets/map/door.png", fallback: ICONS.DOOR },
        MOBOTIX: { src: "assets/map/mobotix.png", fallback: ICONS.MOBO },
      };

      function resolveImg(imgKey) {
        if (!imgKey) return { src: null, fallback: null };
        const entry = IMAGES[imgKey];
        if (!entry) return { src: null, fallback: ICONS.NET };
        return { src: entry.src || null, fallback: entry.fallback || null };
      }

      // ============================================================
      // 2) CONFIG
      // ============================================================

      // APERTURA DE URL: Si true, siempre abre en nueva pestaña; si false, abre en la misma
      const OPEN_IN_NEW_TAB = true; // Puedes cambiar esto según tu preferencia

      // Mostrar etiquetas de conexiones (edges) solo a partir de cierto zoom para evitar saturación visual
      const SHOW_EDGE_LABELS_FROM_K = 1.25;
      // Mostrar sublabels (desc) solo a partir de cierto zoom para evitar saturación visual
      const SHOW_SUBLABELS_FROM_K = 1.15;
      //VELOCIDAD DE ÓRBITA BASE
      const ROT_SPEED_DEFAULT = 0.055;

      // TAMAÑO POR DEFECTO SEGÚN TIPO
      const SIZE_BY_KIND = {
        C: 170,
        L1: 80,
        L2: 50,
        L3: 40,
        L4: 35,
        "S-L1": 30,
        "S-L2": 20,
        "S-L3": 15,
        "S-L4": 10,
      };

      // DISTANCIA AL PADRE
      const ORBIT_PAD_BY_KIND = {
        // Para nodos tipo "C", el pad es grande porque suelen ser grandes y con muchos hijos
        C: 200,
        L1: 100,
        L2: 30,
        L3: 15,
        L4: 10,
        // Para los S-Lx, el pad es más grande para evitar solapamientos al ser más pequeños
        "S-L1": 70,
        "S-L2": 55,
        "S-L3": 40,
        "S-L4": 26,
      };
      // DISTANCIA ENTRE HERMANOS
      const ORBIT_GAP_BY_KIND = {
        // Para nodos tipo "C", el gap es grande porque suelen ser grandes y con muchos hijos
        C: 400,
        L1: 100,
        L2: 1800,
        L3: 80,
        L4: 100,
        // Para los S-Lx, el gap es más grande para evitar solapamientos al ser más pequeños
        "S-L1": 40,
        "S-L2": 15,
        "S-L3": 10,
        "S-L4": 10,
      };

      // Funciones para obtener pad y gap con fallback a valores por tipo
      function orbitPadForChildKind(kind) {
        return ORBIT_PAD_BY_KIND[kind] ?? 50;
      }
      function orbitGapForChildKind(kind) {
        return ORBIT_GAP_BY_KIND[kind] ?? 50;
      }

      // ============================================================

        w_mariadb: {

              type: "soft",
              showAt: [0, 99],
            },
          ],
        },
      };

      // =======================
      // NAV PANEL (ÍNDICE)
      // =======================
      let navSelectedNodeId = null;

      // Ajusta estos nombres a los de tu plantilla si difieren:
      let currentWorldKey = "main"; // si ya existe en tu código, elimina esta línea

      // Helper: normaliza texto
      function norm(s) {
        return (s ?? "").toString().toLowerCase().trim();
      }

      // Helper: nodos visibles según showAt y zoom actual k (si tu plantilla lo usa)
      function nodeIsVisibleAtK(n, k) {
        if (!n.showAt) return true;
        const [min, max] = n.showAt;
        return k >= min && k <= max;
      }

      // 1) Render del panel
      function buildNavPanel() {
        const searchEl = document.getElementById("navSearch");
        const listEl = document.getElementById("navList");

        if (!searchEl || !listEl) return;

        function render() {
          const world = WORLDS[currentWorldKey];
          const runtimeNodes =
            window.__worldNodes ?? world?.nodes ?? [];

          if (!world && !runtimeNodes.length) {
            listEl.innerHTML =
              "<div style='opacity:.7;padding:8px'>World no encontrado</div>";
            return;
          }
// Si tienes d3 zoom, normalmente guardas el transform actual:
          const k = window.__currentZoomK ?? 1; // fallback
          const q = norm(searchEl.value);

          // Filtrar + ordenar
          const nodes = runtimeNodes
            .filter((n) => nodeIsVisibleAtK(n, k))
            .filter((n) => {
              if (!q) return true;
              const hay =
                norm(n.label) +
                " " +
                norm(n.id) +
                " " +
                norm(n.desc) +
                " " +
                norm(n.kind);
              return hay.includes(q);
            })
            .slice()
            .sort(
              (a, b) =>
                (a.kind || "").localeCompare(b.kind || "") ||
                (a.label || a.id).localeCompare(b.label || b.id),
            );

          // Agrupar por kind
          const groups = new Map();
          for (const n of nodes) {
            const key = n.kind || "OTROS";
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(n);
          }

          // Pintar
          let html = "";
          for (const [kind, arr] of groups) {
            html += `<div class="navGroup">
        <div class="navGroupTitle">${kind}</div>
        ${arr
          .map((n) => {
            const title = n.label || n.id;
            const sub = n.desc
              ? `<div class="navSub">${escapeHtml(n.desc)}</div>`
              : "";
            const active = n.id === navSelectedNodeId ? "active" : "";
            return `
            <div class="navItem ${active}" data-node-id="${escapeAttr(n.id)}">
              <span class="navBadge">${escapeHtml(n.kind || "")}</span>
              <div class="navText">
                <div>${escapeHtml(title)}</div>
                ${sub}
              </div>
            </div>
          `;
          })
          .join("")}
      </div>`;
          }

          listEl.innerHTML =
            html ||
            "<div style='opacity:.7;padding:8px'>Sin nodos (con este filtro/zoom)</div>";

          // Click handlers
          listEl.querySelectorAll(".navItem").forEach((el) => {
            el.addEventListener("click", () => {
              const nodeId = el.getAttribute("data-node-id");
              gotoNodeById(nodeId);
            });
          });
        }

        searchEl.addEventListener("input", render);
        render();

        // expón para refrescar desde otros sitios (cambio de mundo, zoom, etc)
        window.refreshNavPanel = render;
      }

      // 2) Navegar al nodo
      function gotoNodeById(nodeId) {
        // 1) Intenta en runtime (mundo cargado)
        let n = window.__worldById?.get(nodeId);

        // 2) Fallback: definición estática del world actual
        if (!n) {
          const world = WORLDS[currentWorldKey];
          if (!world) return;
          n = world.nodes?.find((x) => x.id === nodeId);
        }

        // 3) Si aún no está, busca en todos los mundos (modo índice global)
        if (!n) {
          for (const [wk, w] of Object.entries(WORLDS)) {
            const found = w.nodes?.find((x) => x.id === nodeId);
            if (found) {
              n = found;
              currentWorldKey = wk;
              // OJO: en tu engine real el cambio de mundo es loadWorld(...)
              // Si tienes switchWorld úsalo; si no, lo ideal es llamar a loadWorld(wk,{push:false})
              if (typeof loadWorld === "function") loadWorld(wk, { push: true });
              break;
            }
          }
        }

        if (!n) return;

        navSelectedNodeId = n.id;
        if (window.refreshNavPanel) window.refreshNavPanel();

        // 4) Si el nodo lleva a otro world (portal), entra y luego centra
        if (n.world && WORLDS[n.world]) {
          currentWorldKey = n.world;

          // En tu HTML actual, la función real es loadWorld(...)
          if (typeof loadWorld === "function") {
            loadWorld(n.world, { push: true });
          }

          // Espera 1 frame para que computePositions/update tengan _x/_y
          requestAnimationFrame(() => {
            const nn =
              window.__worldById?.get(nodeId) ||
              window.__worldById?.get("L4_core");
            const tx = nn?._x ?? nn?.x ?? 0;
            const ty = nn?._y ?? nn?.y ?? 0;
            focusWorldPoint(tx, ty, 1.6);
            highlightNode(nn?.id ?? n.id);
          });
          return;
        }

        // 5) Centrar usando posición real si existe (_x/_y), si no x/y
        const tx = n._x ?? n.x ?? 0;
        const ty = n._y ?? n.y ?? 0;

        focusWorldPoint(tx, ty, 1.6);
        highlightNode(n.id);
      }

      // 3) Centrar y hacer zoom a un punto del mundo
      function focusWorldPoint(x, y, targetK = 1.6) {
        // Debes adaptar a tu d3 zoom real: svg + g + zoom behavior.
        // Patrón típico:
        // d3.select(svg).transition().call(zoom.transform, d3.zoomIdentity.translate(cx,cy).scale(k).translate(-x,-y))

        if (!window.__d3Svg || !window.__d3Zoom) {
          // fallback: si no hay d3 guardado, no hacemos nada
          return;
        }

        const svg = window.__d3Svg;
        const zoom = window.__d3Zoom;

        const { width, height } = svg.node().getBoundingClientRect();
        const cx = width / 2;
        const cy = height / 2;

        const t = d3.zoomIdentity
          .translate(cx, cy)
          .scale(targetK)
          .translate(-x, -y);

        svg.transition().duration(650).call(zoom.transform, t);
      }

      // 4) Resaltar nodo (depende de cómo pintes nodos)
      function highlightNode(nodeId) {
        // Ajusta selectores según tu plantilla
        if (!window.__nodesSelection) return;
        window.__nodesSelection.classed("is-highlight", (d) => d.id === nodeId);
      }

      // Utils escape
      function escapeHtml(s) {
        return (s ?? "")
          .toString()
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replaceAll("`", "&#96;");
      }

      // Inicializa panel al cargar
      buildNavPanel();

      // ============================================================
      // 4) ENGINE
      // ============================================================
      const svg = d3.select("#space");
      window.__d3Svg = svg;
      const tooltip = document.getElementById("tooltip");

      const miniWrap = document.getElementById("miniWrap");
      const miniSvg = d3.select("#miniSvg");

      const hudCrumb = document.getElementById("crumb");
      const btnBack = document.getElementById("btnBack");
      const btnHome = document.getElementById("btnHome");
      const btnCenter = document.getElementById("btnCenter");
      const btnFit = document.getElementById("btnFit");
      const btnToggleLabels = document.getElementById("btnToggleLabels");
      const btnToggleEdges = document.getElementById("btnToggleEdges");
      const btnToggleMini = document.getElementById("btnToggleMini");


      // ============================================================
      // 4.x) AUTO-OCULTAR PANELES (30s sin actividad)
      // ============================================================
      const AUTO_HIDE_MS = 30000;
      const hudEl = document.getElementById("hud");
      const navPanelEl = document.getElementById("navPanel");

      let __uiHideTimer = null;

      function uiSetHidden(hidden) {
        const els = [hudEl, navPanelEl, miniWrap].filter(Boolean);
        for (const el of els) {
          el.classList.toggle("ui-hidden", hidden);
        }
      }

      function uiKick() {
        // cualquier actividad => mostrar y reiniciar temporizador
        uiSetHidden(false);
        if (__uiHideTimer) clearTimeout(__uiHideTimer);
        __uiHideTimer = setTimeout(() => uiSetHidden(true), AUTO_HIDE_MS);
      }

      // Actividad que cuenta como “vida”
      ["mousemove", "mousedown", "wheel", "touchstart", "keydown"].forEach((ev) => {
        window.addEventListener(ev, uiKick, { passive: true });
      });

      // Arranca visible
      uiKick();

      let W = window.innerWidth;
      let H = window.innerHeight;

      // Stars background
      const bg = svg.append("g");
      const rand = (a, b) => Math.random() * (b - a) + a;
      function drawStars() {
        bg.selectAll("*").remove();
        for (let i = 0; i < 280; i++) {
          bg.append("circle")
            .attr("cx", rand(0, W))
            .attr("cy", rand(0, H))
            .attr("r", rand(0.4, 1.8))
            .attr("fill", `rgba(255,255,255,${rand(0.12, 0.85)})`);
        }
      }
      drawStars();

      // Single transform group
      const viewport = svg.append("g");
      const edgesG = viewport.append("g");
      const nodesG = viewport.append("g");

      // State
      let currentWorldId = "main";
      let history = ["main"];
      let nodes = [];
      let edges = [];
      let byId = new Map();
      let childrenByParent = new Map();
      let currentTransform = d3.zoomIdentity;

      let showLabels = true;
      let showEdges = true;
      let showMini = true;

      function inRange(showAt, k) {
        if (!showAt) return true;
        return k >= showAt[0] && k <= showAt[1];
      }
      function nodeVisible(n, k) {
        return inRange(n.showAt, k);
      }
      function edgeVisible(e, k) {
        return inRange(e.showAt, k);
      }

      function tipShow(text, x, y) {
        tooltip.style.display = "block";
        tooltip.textContent = text;
        tooltip.style.left = x + 12 + "px";
        tooltip.style.top = y + 12 + "px";
      }
      function tipHide() {
        tooltip.style.display = "none";
      }

      function applyDefaultSizing() {
        for (const n of nodes) {
          if (typeof n.r !== "number") {
            n.r = SIZE_BY_KIND[n.kind] ?? 44;
          }
        }
      }

      function buildChildrenIndex() {
        childrenByParent = new Map();
        for (const n of nodes) {
          if (!n.parent) continue;
          if (!childrenByParent.has(n.parent))
            childrenByParent.set(n.parent, []);
          childrenByParent.get(n.parent).push(n.id);
        }
      }

      function assignOrbitsAndPhases() {
        for (const [parentId, childIds] of childrenByParent.entries()) {
          const p = byId.get(parentId);
          if (!p) continue;

          const n = childIds.length;

          let maxChildR = 0;
          let maxGap = 0;
          let maxPad = 0;

          for (const id of childIds) {
            const c = byId.get(id);
            if (!c) continue;
            maxChildR = Math.max(maxChildR, c.r ?? 30);

            const gap = c.orbitGap ?? orbitGapForChildKind(c.kind);
            const pad = c.orbitPad ?? orbitPadForChildKind(c.kind);
            maxGap = Math.max(maxGap, gap);
            maxPad = Math.max(maxPad, pad);
          }

          // 2πR/n >= 2*maxChildR + maxGap
          const minRByArc = ((2 * maxChildR + maxGap) * n) / (2 * Math.PI);
          // R >= parentR + maxChildR + maxPad
          const minRByParent = (p.r ?? 60) + maxChildR + maxPad;

          const orbitR = Math.max(minRByArc, minRByParent);

          childIds.forEach((id, i) => {
            const c = byId.get(id);
            if (!c) return;
            c._orbitR = orbitR;
            c._phase0 = (Math.PI * 2 * i) / n;

            const base = ROT_SPEED_DEFAULT;
            const extra = c.kind.startsWith("S-")
              ? 0.06
              : c.kind === "L3"
                ? 0.03
                : 0.0;
            c._speed = c.orbitSpeed ?? base + extra;
          });
        }
      }

      function computePositions(t) {
        // Absolutas
        for (const n of nodes) {
          if (typeof n.x === "number" && typeof n.y === "number") {
            n._x = n.x;
            n._y = n.y;
          }
        }

        // Resolver jerarquía por pasadas
        for (let pass = 0; pass < 5; pass++) {
          for (const n of nodes) {
            if (!n.parent) continue;
            const p = byId.get(n.parent);
            if (!p) continue;
            if (typeof p._x !== "number" || typeof p._y !== "number") continue;

            const R =
              n._orbitR ??
              (p.r ?? 60) +
                (n.r ?? 30) +
                (n.orbitPad ?? orbitPadForChildKind(n.kind));
            const a = (n._phase0 ?? 0) + t * (n._speed ?? ROT_SPEED_DEFAULT);

            n._x = p._x + Math.cos(a) * R;
            n._y = p._y + Math.sin(a) * R;
          }
        }
      }

      function getBounds() {
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        for (const n of nodes) {
          const r = (n.r ?? 40) + 50;
          const x = n._x ?? n.x ?? 0;
          const y = n._y ?? n.y ?? 0;
          minX = Math.min(minX, x - r);
          minY = Math.min(minY, y - r);
          maxX = Math.max(maxX, x + r);
          maxY = Math.max(maxY, y + r);
        }
        if (!isFinite(minX))
          return { minX: -300, minY: -300, maxX: 300, maxY: 300 };
        return { minX, minY, maxX, maxY };
      }

      function fitToWorld(duration = 450) {
        const b = getBounds();
        const bw = b.maxX - b.minX;
        const bh = b.maxY - b.minY;
        const pad = 120;

        const scale = Math.min((W - pad) / (bw || 1), (H - pad) / (bh || 1));
        const s = Math.max(0.35, Math.min(scale, 2.25));
        const cx = (b.minX + b.maxX) / 2;
        const cy = (b.minY + b.maxY) / 2;

        const t = d3.zoomIdentity
          .translate(W / 2, H / 2)
          .scale(s)
          .translate(-cx, -cy);

        svg.transition().duration(duration).call(zoom.transform, t);
      }

      function centerView(duration = 350) {
        const b = getBounds();
        const cx = (b.minX + b.maxX) / 2;
        const cy = (b.minY + b.maxY) / 2;
        const s = currentTransform.k;

        const t = d3.zoomIdentity
          .translate(W / 2, H / 2)
          .scale(s)
          .translate(-cx, -cy);

        svg.transition().duration(duration).call(zoom.transform, t);
      }

      // --- Render con fallback automático usando imgKey -> IMAGES
      function drawWorld() {
        edgesG.selectAll("*").remove();
        nodesG.selectAll("*").remove();

        const edgeWrap = edgesG
          .selectAll("g.edgeWrap")
          .data(edges, (d) => `${d.s}->${d.t}`)
          .enter()
          .append("g")
          .attr("class", "edgeWrap");

        edgeWrap
          .append("line")
          .attr("class", (d) => (d.type === "soft" ? "edge soft" : "edge"));

        edgeWrap
          .append("text")
          .attr("class", "edgeLabel")
          .attr("text-anchor", "middle");

        const nodeG = nodesG
          .selectAll("g.node")
          .data(nodes, (d) => d.id)
          .enter()
          .append("g")
          .attr("class", "node");

        window.__nodesSelection = nodeG;

        nodeG
          .append("circle")
          .attr("class", "ring")
          .attr("r", (d) => (d.kind === "C" ? (d.r ?? 150) + 55 : 0))
          .style("display", (d) => (d.kind === "C" ? null : "none"));

        nodeG.each(function (d) {
          const g = d3.select(this);
          const r = d.r ?? 40;

          const { src, fallback } = resolveImg(d.imgKey);

          // Siempre intentamos src si existe; si no, usamos fallback
          const initialHref = src || fallback || null;

          if (initialHref) {
            const imgEl = g
              .append("image")
              .attr("href", initialHref)
              .attr("x", -r)
              .attr("y", -r)
              .attr("width", r * 2)
              .attr("height", r * 2);

            // Fallback automático SOLO si había src real y falla
            if (src && fallback) {
              imgEl.on("error", function () {
                d3.select(this).attr("href", fallback);
              });
            }

            g.append("circle").attr("class", "planetStroke").attr("r", r);
          } else {
            // Si ni src ni fallback, dibuja círculo
            g.append("circle")
              .attr("r", r)
              .attr("fill", "rgba(120,160,255,0.70)")
              .attr("stroke", "rgba(255,255,255,0.16)")
              .attr("stroke-width", 2);
          }

          g.append("circle")
            .attr("class", "nodeHit")
            .attr("r", r + 16);
        });

        nodeG
          .append("text")
          .attr("class", "label")
          .attr("text-anchor", "middle")
          .attr("y", (d) => (d.r ?? 40) + 20)
          .text((d) => d.label);

        nodeG
          .append("text")
          .attr("class", "sub")
          .attr("text-anchor", "middle")
          .attr("y", (d) => (d.r ?? 40) + 38)
          .text((d) => d.desc ?? "");

        nodeG
          .on("mouseenter", (e, d) =>
            tipShow(
              `${d.label}${d.desc ? " — " + d.desc : ""}`,
              e.clientX,
              e.clientY,
            ),
          )
          .on("mousemove", (e, d) =>
            tipShow(
              `${d.label}${d.desc ? " — " + d.desc : ""}`,
              e.clientX,
              e.clientY,
            ),
          )
          .on("mouseleave", tipHide)
          .on("click", (e, d) => {
            const shift = e.shiftKey;

            if (d.world && !shift) {
              enterWorld(d.world, d.id);
              return;
            }
            if (d.url) {
              if (shift) window.open(d.url, "_blank");
              else
                OPEN_IN_NEW_TAB
                  ? window.open(d.url, "_blank")
                  : (window.location.href = d.url);
            }
          });
      }

      function update() {
        const k = currentTransform.k;

        nodesG
          .selectAll("g.node")
          .style("display", (d) => (nodeVisible(d, k) ? null : "none"))
          .attr("transform", (d) => `translate(${d._x ?? 0},${d._y ?? 0})`);

        nodesG
          .selectAll("text.label")
          .style("display", showLabels ? null : "none");
        nodesG
          .selectAll("text.sub")
          .style(
            "display",
            showLabels && k >= SHOW_SUBLABELS_FROM_K ? null : "none",
          );

        edgesG.style("display", showEdges ? null : "none");

        edgesG.selectAll("g.edgeWrap").each(function (e) {
          const a = byId.get(e.s);
          const b = byId.get(e.t);
          if (!a || !b) return;

          const vis =
            showEdges &&
            edgeVisible(e, k) &&
            nodeVisible(a, k) &&
            nodeVisible(b, k);
          d3.select(this).style("display", vis ? null : "none");

          const ax = a._x ?? 0,
            ay = a._y ?? 0;
          const bx = b._x ?? 0,
            by = b._y ?? 0;

          d3.select(this)
            .select("line")
            .attr("x1", ax)
            .attr("y1", ay)
            .attr("x2", bx)
            .attr("y2", by);

          d3.select(this)
            .select("text")
            .attr("x", (ax + bx) / 2)
            .attr("y", (ay + by) / 2 - 8)
            .text(
              showLabels && k >= SHOW_EDGE_LABELS_FROM_K ? (e.label ?? "") : "",
            );
        });

        updateMiniMap();
      }

      // Zoom
      const zoom = d3
        .zoom()
        .scaleExtent([0.35, 8])
        .on("zoom", (event) => {
          currentTransform = event.transform;

          // 👇 AÑADE ESTO
          window.__currentZoomK = event.transform.k;
          if (window.refreshNavPanel) window.refreshNavPanel();

          viewport.attr("transform", currentTransform);
          update();
        });

      // 👇 AÑADE ESTO
      window.__d3Zoom = zoom;

      svg.call(zoom);

      // Worlds nav
      function setBreadcrumb() {
        const parts = history.map((id) => WORLDS[id]?.name ?? id);
        hudCrumb.textContent = "Ruta: " + parts.join("  ›  ");
        btnBack.toggleAttribute("disabled", history.length <= 1);
      }

      function loadWorld(worldId, { push = true } = {}) {
        const w = WORLDS[worldId];
        if (!w) return;

        currentWorldId = worldId;
        if (push) history.push(worldId);
        setBreadcrumb();

        nodes = w.nodes.map((n) => ({ ...n }));
        edges = (w.edges ?? []).map((e) => ({ ...e }));
        byId = new Map(nodes.map((n) => [n.id, n]));

        window.__worldNodes = nodes;
        window.__worldById = byId;
        currentWorldKey = currentWorldId;
        if (window.refreshNavPanel) window.refreshNavPanel();

        applyDefaultSizing();
        buildChildrenIndex();
        assignOrbitsAndPhases();

        drawWorld();
        fitToWorld(450);
      }

      function enterWorld(worldId, fromNodeId) {
        const n = byId.get(fromNodeId);
        if (!n) {
          loadWorld(worldId);
          return;
        }

        const targetScale = Math.min(5.0, Math.max(currentTransform.k, 2.7));
        const t = d3.zoomIdentity
          .translate(W / 2, H / 2)
          .scale(targetScale)
          .translate(-(n._x ?? 0), -(n._y ?? 0));

        svg
          .transition()
          .duration(360)
          .call(zoom.transform, t)
          .on("end", () => {
            history.push(worldId);
            loadWorld(worldId, { push: false });
          });
      }

      // Minimapa
      const mini = { w: 260, h: 180, pad: 14, scale: 1, tx: 0, ty: 0 };
      miniSvg.attr("viewBox", `0 0 ${mini.w} ${mini.h}`);
      const miniG = miniSvg.append("g");
      miniG
        .append("rect")
        .attr("class", "miniBg")
        .attr("x", 0)
        .attr("y", 0)
        .attr("width", mini.w)
        .attr("height", mini.h);
      const miniEdgesG = miniG.append("g");
      const miniNodesG = miniG.append("g");
      const miniViewport = miniG
        .append("rect")
        .attr("class", "miniViewport")
        .attr("x", 30)
        .attr("y", 30)
        .attr("width", 60)
        .attr("height", 40);

      function computeMiniTransform() {
        const b = getBounds();
        const bw = b.maxX - b.minX;
        const bh = b.maxY - b.minY;
        const aw = mini.w - mini.pad * 2;
        const ah = mini.h - mini.pad * 2;
        const s = Math.min(aw / (bw || 1), ah / (bh || 1));
        mini.scale = s;
        mini.tx = -b.minX * s + mini.pad;
        mini.ty = -b.minY * s + mini.pad;
      }
      function worldToMini(x, y) {
        return [x * mini.scale + mini.tx, y * mini.scale + mini.ty];
      }
      function miniToWorld(x, y) {
        return [(x - mini.tx) / mini.scale, (y - mini.ty) / mini.scale];
      }

      function updateMiniMap() {
        if (!showMini) return;
        computeMiniTransform();

        miniEdgesG.selectAll("*").remove();
        miniNodesG.selectAll("*").remove();

        for (const e of edges) {
          const a = byId.get(e.s),
            b = byId.get(e.t);
          if (!a || !b) continue;
          const [ax, ay] = worldToMini(a._x ?? a.x ?? 0, a._y ?? a.y ?? 0);
          const [bx, by] = worldToMini(b._x ?? b.x ?? 0, b._y ?? b.y ?? 0);
          miniEdgesG
            .append("line")
            .attr("class", "miniEdge")
            .attr("x1", ax)
            .attr("y1", ay)
            .attr("x2", bx)
            .attr("y2", by);
        }

        for (const n of nodes) {
          const [mx, my] = worldToMini(n._x ?? n.x ?? 0, n._y ?? n.y ?? 0);
          miniNodesG
            .append("circle")
            .attr("class", "miniNode")
            .attr("cx", mx)
            .attr("cy", my)
            .attr("r", n.kind === "C" ? 3.4 : 2.6);
        }

        const k = currentTransform.k,
          tx = currentTransform.x,
          ty = currentTransform.y;
        const leftWorld = (0 - tx) / k;
        const topWorld = (0 - ty) / k;
        const rightWorld = (W - tx) / k;
        const bottomWorld = (H - ty) / k;

        const [lmx, lmy] = worldToMini(leftWorld, topWorld);
        const [rmx, rmy] = worldToMini(rightWorld, bottomWorld);

        miniViewport
          .attr("x", Math.min(lmx, rmx))
          .attr("y", Math.min(lmy, rmy))
          .attr("width", Math.abs(rmx - lmx))
          .attr("height", Math.abs(rmy - lmy));
      }

      const dragViewport = d3.drag().on("drag", (event) => {
        const nx = clamp(
          parseFloat(miniViewport.attr("x")) + event.dx,
          0,
          mini.w,
        );
        const ny = clamp(
          parseFloat(miniViewport.attr("y")) + event.dy,
          0,
          mini.h,
        );
        miniViewport.attr("x", nx).attr("y", ny);
        const cxm = nx + parseFloat(miniViewport.attr("width")) / 2;
        const cym = ny + parseFloat(miniViewport.attr("height")) / 2;
        panToMiniPoint(cxm, cym, 0);
      });
      miniViewport.call(dragViewport);

      miniSvg.on("click", (event) => {
        const [x, y] = d3.pointer(event);
        panToMiniPoint(x, y, 250);
      });

      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }
      function panToMiniPoint(mx, my, duration = 250) {
        const [wx, wy] = miniToWorld(mx, my);
        const s = currentTransform.k;
        const t = d3.zoomIdentity
          .translate(W / 2, H / 2)
          .scale(s)
          .translate(-wx, -wy);
        if (duration <= 0) svg.call(zoom.transform, t);
        else svg.transition().duration(duration).call(zoom.transform, t);
      }

      // UI
      btnBack.addEventListener("click", () => {
        if (history.length <= 1) return;
        history.pop();
        const prev = history[history.length - 1];
        loadWorld(prev, { push: false });
      });
      btnHome.addEventListener("click", () => {
        history = ["main"];
        loadWorld("main", { push: false });
      });
      btnCenter.addEventListener("click", () => centerView(350));
      btnFit.addEventListener("click", () => fitToWorld(450));

      btnToggleLabels.addEventListener("click", () => {
        showLabels = !showLabels;
        btnToggleLabels.textContent = showLabels
          ? "Aa Etiquetas"
          : "Aa Etiquetas (off)";
        update();
      });
      btnToggleEdges.addEventListener("click", () => {
        showEdges = !showEdges;
        btnToggleEdges.textContent = showEdges
          ? "— Conexiones"
          : "— Conexiones (off)";
        update();
      });
      btnToggleMini.addEventListener("click", () => {
        showMini = !showMini;
        miniWrap.style.display = showMini ? "block" : "none";
        btnToggleMini.textContent = showMini
          ? "▣ Minimapa"
          : "▣ Minimapa (off)";
        update();
      });

      // Animate
      let t0 = performance.now();
      function tick(now) {
        const t = (now - t0) / 1000;
        computePositions(t);
        update();
        requestAnimationFrame(tick);
      }

      // Init
      loadWorld("main", { push: false });
      setBreadcrumb();
      requestAnimationFrame(tick);

      // Resize
      window.addEventListener("resize", () => {
        W = window.innerWidth;
        H = window.innerHeight;
        drawStars();
        viewport.attr("transform", currentTransform);
        update();
      });
    </script>
  </body>
</html>

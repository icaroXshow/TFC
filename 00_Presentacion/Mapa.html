<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KWL — Universo Navegable (Refinado + minimapa)</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root{
      --bg:#02030a;
      --panel:rgba(10,12,25,.55);
      --panel-b:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.72);
      --line:rgba(255,255,255,.18);
      --halo:rgba(120,160,255,.10);
      --ring:rgba(120,160,255,.18);
    }
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    svg{width:100vw;height:100vh;display:block}

    #hud{
      position:fixed;left:16px;top:16px;z-index:10;
      background:var(--panel);border:1px solid var(--panel-b);
      padding:10px 12px;border-radius:12px;color:var(--text);
      backdrop-filter:blur(10px);max-width:600px
    }
    #title{font-weight:850;letter-spacing:.2px}
    #crumb{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.25}
    #hint{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.25}
    #actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
    .btn{
      cursor:pointer;user-select:none;
      padding:7px 10px;border-radius:10px;
      border:1px solid var(--panel-b);
      background:rgba(0,0,0,.35);
      color:var(--text);font-size:12px
    }
    .btn:active{transform:translateY(1px)}
    .btn[disabled]{opacity:.5;cursor:not-allowed}

    #tooltip{
      position:fixed;pointer-events:none;z-index:20;
      padding:6px 8px;border-radius:10px;
      background:rgba(0,0,0,.68);color:white;font-size:12px;
      border:1px solid var(--panel-b);
      display:none;max-width:460px;white-space:pre-line
    }

    /* minimapa */
    #miniWrap{
      position:fixed;right:16px;bottom:16px;z-index:10;
      width:240px;height:160px;
      background:rgba(10,12,25,.45);
      border:1px solid var(--panel-b);
      border-radius:12px;
      backdrop-filter:blur(8px);
      overflow:hidden;
    }
    #miniTitle{
      position:absolute;left:10px;top:8px;
      font-size:11px;color:var(--muted);user-select:none
    }
    #miniSvg{width:100%;height:100%}
    .miniViewport{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.35);stroke-width:1.5}
    .miniNode{fill:rgba(255,255,255,.35)}
    .miniEdge{stroke:rgba(255,255,255,.18);stroke-width:1}
    .miniBg{fill:rgba(0,0,0,.05)}

    /* mapa */
    .edge{stroke:var(--line);stroke-width:2}
    .edge.soft{stroke-width:1.6;stroke:rgba(255,255,255,.14)}
    .edgeLabel{fill:rgba(255,255,255,.52);font-size:11px;user-select:none}
    .label{fill:var(--text);font-weight:760;font-size:13px;user-select:none;pointer-events:none}
    .sub{fill:var(--muted);font-size:11px;user-select:none;pointer-events:none}
    .halo{filter:url(#glow)}
    .ring{fill:none;stroke:var(--ring);stroke-width:2}
    .nodeHit{cursor:pointer;fill:transparent}
    .planetStroke{fill:rgba(0,0,0,.10);stroke:rgba(255,255,255,.16);stroke-width:2}
  </style>
</head>

<body>
  <div id="hud">
    <div id="title">KWL — Universo Navegable</div>
    <div id="crumb">Ruta: Universo</div>
    <div id="hint">Rueda: zoom · Arrastra: mover · Click: entrar/abrir · Shift+Click: abrir URL nueva pestaña · Minimapa: click/arrastrar viewport</div>
    <div id="actions">
      <div class="btn" id="btnBack" disabled>← Volver</div>
      <div class="btn" id="btnHome">⌂ Inicio</div>
      <div class="btn" id="btnCenter">◎ Centrar</div>
      <div class="btn" id="btnFit">⤢ Ajustar</div>
      <div class="btn" id="btnToggleLabels">Aa Etiquetas</div>
      <div class="btn" id="btnToggleEdges">— Conexiones</div>
      <div class="btn" id="btnToggleMini">▣ Minimapa</div>
    </div>
  </div>

  <div id="tooltip"></div>

  <div id="miniWrap">
    <div id="miniTitle">Navegador</div>
    <svg id="miniSvg"></svg>
  </div>

  <svg id="space" role="img" aria-label="Mapa galáctico jerárquico"></svg>

  <script>
    // =========================
    // CONFIG
    // =========================
    const OPEN_IN_NEW_TAB = false;
    const SHOW_EDGE_LABELS_FROM_K = 1.25;
    const SHOW_SUBLABELS_FROM_K   = 1.15;

    const ORBIT = {
      clusterChildren: 280,
      planetChildren:  230,
      moonChildren:    190,
      satChildren:     155,
      microWorld:      250
    };

    // =========================
    // WORLDS
    // =========================
    const WORLDS = {
      main: {
        name: "Universo",
        nodes: [
          { id:"C_red",  kind:"C",  label:"[C] Red",    desc:"VPN · VLAN · FW", x:-620, y:-190, r:150, img:"/assets/map/net.png", url:"http://localhost/docs/red" },
          { id:"C_srv",  kind:"C",  label:"[C] Server", desc:"Proxmox · VMs",   x: 620, y:-180, r:160, img:"/assets/map/server.png", url:"http://localhost/docs/server" },
          { id:"C_iot",  kind:"C",  label:"[C] IoT",    desc:"ESP32 · máquinas",x:-520, y: 380, r:140, img:"/assets/map/iot.png", url:"http://localhost/docs/iot" },
          { id:"C_cctv", kind:"C",  label:"[C] CCTV",   desc:"Cámaras",         x: 520, y: 400, r:130, img:"/assets/map/cctv.png", url:"http://localhost/docs/cctv" },

          { id:"L1_mov",  parent:"C_red", kind:"L1", label:"[L1] Movistar", desc:"WAN/NAT", r:50,
            orbit:{ r: ORBIT.clusterChildren, speed:0.05, phase:0.3 }, img:"/assets/map/movistar.png", url:"http://localhost/docs/red/movistar" },

          { id:"L1_mtik", parent:"C_red", kind:"L1", label:"[L1] MikroTik", desc:"VPN/VLAN/FW", r:60,
            orbit:{ r: ORBIT.clusterChildren, speed:0.06, phase:2.2 }, img:"/assets/map/mikrotik.png", url:"http://localhost/docs/red/mikrotik" },

          { id:"L1_sw",   parent:"C_red", kind:"L1", label:"[L1] Switch", desc:"Trunk/VLAN", r:46,
            orbit:{ r: ORBIT.clusterChildren, speed:0.055, phase:4.8 }, img:"/assets/map/switch.png", url:"http://localhost/docs/red/switch" },

          { id:"L1_host", parent:"C_srv", kind:"L1", label:"[L1] Host físico", desc:"Intel i9 · SSD · 16GB", r:72,
            orbit:{ r: ORBIT.clusterChildren+25, speed:0.045, phase:1.2 }, img:"/assets/map/host.png", url:"http://localhost/docs/server/host" },

          { id:"L2_pve", parent:"L1_host", kind:"L2", label:"[L2] Proxmox", desc:"Hipervisor", r:48,
            showAt:[1.45,99], orbit:{ r: ORBIT.planetChildren, speed:0.16, phase:0.6 }, img:"/assets/map/proxmox.png", url:"https://proxmox.local:8006" },

          { id:"L3_vmdeb", parent:"L2_pve", kind:"L3", label:"[L3] VM Debian", desc:"Core", r:40,
            showAt:[1.90,99], orbit:{ r: ORBIT.moonChildren, speed:0.22, phase:2.0 }, img:"/assets/map/debian.png", url:"http://localhost/docs/server/vm-debian" },

          { id:"S3_nginx", parent:"L3_vmdeb", kind:"S-L3", label:"[S-L3] nginx", desc:"web", r:22,
            showAt:[2.45,99], orbit:{ r: ORBIT.satChildren, speed:0.58, phase:0.2 }, img:"/assets/map/nginx.png", url:"http://localhost/docs/server/nginx" },

          { id:"S3_php", parent:"L3_vmdeb", kind:"S-L3", label:"[S-L3] php-fpm", desc:"api", r:22,
            showAt:[2.45,99], orbit:{ r: ORBIT.satChildren, speed:0.48, phase:2.2 }, img:"/assets/map/php.png", url:"http://localhost/docs/server/php" },

          { id:"S3_db", parent:"L3_vmdeb", kind:"S-L3", label:"[S-L3][W] MariaDB", desc:"db", r:24,
            showAt:[2.45,99], orbit:{ r: ORBIT.satChildren, speed:0.36, phase:4.3 }, img:"/assets/map/mariadb.png",
            world:"w_mariadb", url:"http://localhost/docs/server/mariadb" },

          { id:"S3_redis", parent:"L3_vmdeb", kind:"S-L3", label:"[S-L3] Redis", desc:"cache", r:22,
            showAt:[2.45,99], orbit:{ r: ORBIT.satChildren, speed:0.30, phase:5.6 }, img:"/assets/map/redis.png", url:"http://localhost/docs/server/redis" },

          { id:"L1_iot_m", parent:"C_iot", kind:"L1", label:"[L1] ESP32 Máquinas", desc:"x5", r:54,
            orbit:{ r: ORBIT.clusterChildren, speed:0.062, phase:1.5 }, img:"/assets/map/esp32.png", url:"http://localhost/docs/iot/esp32-maquinas" },

          { id:"L1_iot_d", parent:"C_iot", kind:"L1", label:"[L1] ESP32 Puerta", desc:"relé persiana", r:46,
            orbit:{ r: ORBIT.clusterChildren, speed:0.055, phase:3.8 }, img:"/assets/map/door.png", url:"http://localhost/docs/iot/puerta" },

          { id:"L1_mobo", parent:"C_cctv", kind:"L1", label:"[L1] MOBOTIX", desc:"x2", r:50,
            orbit:{ r: ORBIT.clusterChildren, speed:0.05, phase:2.4 }, img:"/assets/map/mobotix.png", url:"http://localhost/docs/cctv/mobotix" }
        ],
        edges: [
          { s:"L1_mov",  t:"L1_mtik",  label:"WAN",      type:"net",  showAt:[0.80,99] },
          { s:"L1_mtik", t:"L1_sw",    label:"LAN trunk",type:"net",  showAt:[0.80,99] },
          { s:"L1_sw",   t:"L1_host",  label:"LAN",      type:"net",  showAt:[0.80,99] },

          { s:"L1_host", t:"L2_pve",   label:"hipervisor", type:"soft", showAt:[1.55,99] },
          { s:"L2_pve",  t:"L3_vmdeb", label:"VM",         type:"soft", showAt:[1.95,99] },

          { s:"L3_vmdeb", t:"S3_nginx", label:"svc", type:"soft", showAt:[2.50,99] },
          { s:"L3_vmdeb", t:"S3_php",   label:"svc", type:"soft", showAt:[2.50,99] },
          { s:"L3_vmdeb", t:"S3_db",    label:"svc", type:"soft", showAt:[2.50,99] },
          { s:"L3_vmdeb", t:"S3_redis", label:"svc", type:"soft", showAt:[2.50,99] },

          { s:"L1_mtik", t:"C_iot", label:"VLAN IoT", type:"net", showAt:[0.75,99] }
        ]
      },

      w_mariadb: {
        name: "MariaDB",
        nodes: [
          { id:"L4_core", kind:"L4", label:"[L4] MariaDB Core", desc:"motor", x:0, y:0, r:76, img:"/assets/map/mariadb.png", url:"http://localhost/docs/server/mariadb" },

          { id:"S4_pma", parent:"L4_core", kind:"S-L4", label:"[S-L4] phpMyAdmin", desc:"admin", r:30,
            orbit:{ r: ORBIT.microWorld, speed:0.20, phase:0.3 }, img:"/assets/map/phpmyadmin.png", url:"http://localhost/phpmyadmin" },

          { id:"S4_mer", parent:"L4_core", kind:"S-L4", label:"[S-L4] MER", desc:"E/R", r:28,
            orbit:{ r: ORBIT.microWorld, speed:0.17, phase:2.3 }, img:"/assets/map/mer.png", url:"http://localhost/docs/db/mer" },

          { id:"S4_rel", parent:"L4_core", kind:"S-L4", label:"[S-L4] Diseño relacional", desc:"tablas", r:28,
            orbit:{ r: ORBIT.microWorld, speed:0.14, phase:4.6 }, img:"/assets/map/relational.png", url:"http://localhost/docs/db/relacional" },

          { id:"S4_bak", parent:"L4_core", kind:"S-L4", label:"[S-L4] Backups", desc:"dump/snap", r:26,
            orbit:{ r: ORBIT.microWorld, speed:0.12, phase:5.7 }, img:"/assets/map/backup.png", url:"http://localhost/docs/db/backups" }
        ],
        edges: [
          { s:"L4_core", t:"S4_pma", label:"tool", type:"soft", showAt:[0,99] },
          { s:"L4_core", t:"S4_mer", label:"doc",  type:"soft", showAt:[0,99] },
          { s:"L4_core", t:"S4_rel", label:"doc",  type:"soft", showAt:[0,99] },
          { s:"L4_core", t:"S4_bak", label:"ops",  type:"soft", showAt:[0,99] }
        ]
      }
    };

    // =========================
    // ENGINE
    // =========================
    const svg = d3.select("#space");
    const tooltip = document.getElementById("tooltip");

    const miniWrap = document.getElementById("miniWrap");
    const miniSvg  = d3.select("#miniSvg");

    const hudCrumb = document.getElementById("crumb");
    const btnBack = document.getElementById("btnBack");
    const btnHome = document.getElementById("btnHome");
    const btnCenter = document.getElementById("btnCenter");
    const btnFit = document.getElementById("btnFit");
    const btnToggleLabels = document.getElementById("btnToggleLabels");
    const btnToggleEdges = document.getElementById("btnToggleEdges");
    const btnToggleMini = document.getElementById("btnToggleMini");

    let W = window.innerWidth;
    let H = window.innerHeight;

    // defs glow
    const defs = svg.append("defs");
    const glow = defs.append("filter").attr("id","glow");
    glow.append("feGaussianBlur").attr("stdDeviation","2.2").attr("result","b");
    const merge = glow.append("feMerge");
    merge.append("feMergeNode").attr("in","b");
    merge.append("feMergeNode").attr("in","SourceGraphic");

    // fondo estrellas
    const bg = svg.append("g");
    const rand = (a,b)=>Math.random()*(b-a)+a;
    function drawStars(){
      bg.selectAll("*").remove();
      for (let i=0;i<260;i++){
        bg.append("circle")
          .attr("cx", rand(0,W)).attr("cy", rand(0,H))
          .attr("r", rand(0.4,1.8))
          .attr("fill", `rgba(255,255,255,${rand(0.12,0.85)})`);
      }
    }
    drawStars();

    // ÚNICO grupo transformado por D3 zoom (sin translate fijo)
    const viewport = svg.append("g");
    const edgesG = viewport.append("g");
    const nodesG = viewport.append("g");

    // Estado
    let currentWorldId = "main";
    let history = ["main"];
    let nodes = [];
    let edges = [];
    let byId = new Map();
    let currentTransform = d3.zoomIdentity;

    let showLabels = true;
    let showEdges = true;
    let showMini = true;

    // Visibilidad por zoom
    function inRange(showAt, k){
      if(!showAt) return true;
      return k >= showAt[0] && k <= showAt[1];
    }

    function nodeVisible(n, k){ return inRange(n.showAt, k); }
    function edgeVisible(e, k){ return inRange(e.showAt, k); }

    // Tooltip
    function tipShow(text, x, y){
      tooltip.style.display = "block";
      tooltip.textContent = text;
      tooltip.style.left = (x + 12) + "px";
      tooltip.style.top = (y + 12) + "px";
    }
    function tipHide(){ tooltip.style.display = "none"; }

    function setBreadcrumb(){
      const parts = history.map(id => WORLDS[id]?.name ?? id);
      hudCrumb.textContent = "Ruta: " + parts.join("  ›  ");
      btnBack.toggleAttribute("disabled", history.length <= 1);
    }

    // Cálculo de posiciones
    function computePositions(t){
      // Absolutas
      for (const n of nodes){
        if (typeof n.x === "number" && typeof n.y === "number"){
          n._x = n.x; n._y = n.y;
        }
      }
      // Órbitas
      for (const n of nodes){
        if (!n.parent) continue;
        const p = byId.get(n.parent);
        if (!p) continue;
        const o = n.orbit || { r: ORBIT.planetChildren, speed:0.12, phase:0 };
        const a = (t * o.speed) + (o.phase || 0);
        n._x = (p._x ?? 0) + Math.cos(a) * o.r;
        n._y = (p._y ?? 0) + Math.sin(a) * o.r;
      }
      // Anti-colisión ligera dentro del mismo parent
      const minDist = 30;
      for (let iter=0; iter<2; iter++){
        for (let i=0;i<nodes.length;i++){
          for (let j=i+1;j<nodes.length;j++){
            const a = nodes[i], b = nodes[j];
            if (a.parent && b.parent && a.parent === b.parent){
              const dx = (b._x ?? 0) - (a._x ?? 0);
              const dy = (b._y ?? 0) - (a._y ?? 0);
              const d  = Math.hypot(dx,dy) || 0.0001;
              const ra = (a.r ?? 30), rb = (b.r ?? 30);
              const need = ra + rb + minDist;
              if (d < need){
                const push = (need - d) * 0.5;
                const ux = dx / d, uy = dy / d;
                a._x -= ux * push; a._y -= uy * push;
                b._x += ux * push; b._y += uy * push;
              }
            }
          }
        }
      }
    }

    // Render base (se crea una vez por world)
    function drawWorld(){
      edgesG.selectAll("*").remove();
      nodesG.selectAll("*").remove();

      // edges
      const edgeWrap = edgesG.selectAll("g.edgeWrap")
        .data(edges, d => `${d.s}->${d.t}`)
        .enter().append("g").attr("class","edgeWrap");

      edgeWrap.append("line")
        .attr("class", d => d.type==="soft" ? "edge soft" : "edge");

      edgeWrap.append("text")
        .attr("class","edgeLabel")
        .attr("text-anchor","middle");

      // nodes
      const nodeG = nodesG.selectAll("g.node")
        .data(nodes, d => d.id)
        .enter().append("g").attr("class","node");

      nodeG.append("circle")
        .attr("class","halo")
        .attr("r", d => (d.r ?? 40) + 12)
        .attr("fill", "rgba(120,160,255,0.10)");

      nodeG.append("circle")
        .attr("class","ring")
        .attr("r", d => d.kind==="C" ? (d.r ?? 120) + 34 : 0)
        .style("display", d => d.kind==="C" ? null : "none");

      nodeG.each(function(d){
        const g = d3.select(this);
        const r = d.r ?? 40;
        if (d.img){
          g.append("image")
            .attr("href", d.img)
            .attr("x", -r).attr("y", -r)
            .attr("width", r*2).attr("height", r*2);
          g.append("circle").attr("class","planetStroke").attr("r", r);
        } else {
          g.append("circle")
            .attr("r", r)
            .attr("fill", "rgba(120,160,255,0.70)")
            .attr("stroke","rgba(255,255,255,0.16)")
            .attr("stroke-width",2);
        }
        g.append("circle").attr("class","nodeHit").attr("r", r + 14);
      });

      nodeG.append("text")
        .attr("class","label")
        .attr("text-anchor","middle")
        .attr("y", d => (d.r ?? 40) + 18)
        .text(d => d.label);

      nodeG.append("text")
        .attr("class","sub")
        .attr("text-anchor","middle")
        .attr("y", d => (d.r ?? 40) + 34)
        .text(d => d.desc ?? "");

      // interaction
      nodeG
        .on("mouseenter", (e,d)=> tipShow(`${d.label}${d.desc ? " — " + d.desc : ""}`, e.clientX, e.clientY))
        .on("mousemove",  (e,d)=> tipShow(`${d.label}${d.desc ? " — " + d.desc : ""}`, e.clientX, e.clientY))
        .on("mouseleave", tipHide)
        .on("click", (e,d)=>{
          const shift = e.shiftKey;
          if (d.world && !shift){
            enterWorld(d.world, d.id);
            return;
          }
          if (d.url){
            if (shift) window.open(d.url, "_blank");
            else (OPEN_IN_NEW_TAB ? window.open(d.url, "_blank") : (window.location.href = d.url));
          }
        });
    }

    // Update posiciones/visibilidad
    function update(){
      const k = currentTransform.k;

      nodesG.selectAll("g.node")
        .style("display", d => nodeVisible(d,k) ? null : "none")
        .attr("transform", d => `translate(${d._x ?? 0},${d._y ?? 0})`);

      nodesG.selectAll("text.label").style("display", showLabels ? null : "none");
      nodesG.selectAll("text.sub").style("display", (showLabels && k >= SHOW_SUBLABELS_FROM_K) ? null : "none");

      edgesG.style("display", showEdges ? null : "none");

      edgesG.selectAll("g.edgeWrap").each(function(e){
        const a = byId.get(e.s);
        const b = byId.get(e.t);
        if (!a || !b) return;

        const vis = showEdges && edgeVisible(e,k) && nodeVisible(a,k) && nodeVisible(b,k);
        d3.select(this).style("display", vis ? null : "none");

        const ax = a._x ?? 0, ay = a._y ?? 0;
        const bx = b._x ?? 0, by = b._y ?? 0;

        d3.select(this).select("line")
          .attr("x1", ax).attr("y1", ay)
          .attr("x2", bx).attr("y2", by);

        d3.select(this).select("text")
          .attr("x", (ax+bx)/2)
          .attr("y", (ay+by)/2 - 6)
          .text((showLabels && k >= SHOW_EDGE_LABELS_FROM_K) ? (e.label ?? "") : "");
      });

      updateMiniMap();
    }

    // =========================
    // ZOOM (único transform)
    // =========================
    const zoom = d3.zoom()
      .scaleExtent([0.35, 8])
      .on("zoom", (event)=>{
        currentTransform = event.transform;
        viewport.attr("transform", currentTransform);
        update();
      });

    svg.call(zoom);

    // =========================
    // BOUNDS + FIT/CENTER
    // =========================
    function getBounds(){
      // bounds de todos los nodos del mundo (independiente del zoom actual)
      let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
      for (const n of nodes){
        const r = (n.r ?? 40) + 30;
        const x = n._x ?? n.x ?? 0;
        const y = n._y ?? n.y ?? 0;
        minX = Math.min(minX, x - r);
        minY = Math.min(minY, y - r);
        maxX = Math.max(maxX, x + r);
        maxY = Math.max(maxY, y + r);
      }
      if (!isFinite(minX)) return {minX:-300,minY:-300,maxX:300,maxY:300};
      return {minX,minY,maxX,maxY};
    }

    function fitToWorld(duration=500){
      const b = getBounds();
      const bw = b.maxX - b.minX;
      const bh = b.maxY - b.minY;
      const pad = 80;

      const scale = Math.min(
        (W - pad) / (bw || 1),
        (H - pad) / (bh || 1)
      );

      const s = Math.max(0.35, Math.min(scale, 2.2));
      const cx = (b.minX + b.maxX) / 2;
      const cy = (b.minY + b.maxY) / 2;

      const t = d3.zoomIdentity
        .translate(W/2, H/2)
        .scale(s)
        .translate(-cx, -cy);

      svg.transition().duration(duration).call(zoom.transform, t);
    }

    function centerView(duration=350){
      // centra al centro del mundo con el zoom actual
      const b = getBounds();
      const cx = (b.minX + b.maxX) / 2;
      const cy = (b.minY + b.maxY) / 2;

      const s = currentTransform.k;
      const t = d3.zoomIdentity
        .translate(W/2, H/2)
        .scale(s)
        .translate(-cx, -cy);

      svg.transition().duration(duration).call(zoom.transform, t);
    }

    // =========================
    // WORLDS NAV
    // =========================
    function loadWorld(worldId, {push=true}={}){
      const w = WORLDS[worldId];
      if (!w) return;

      currentWorldId = worldId;
      if (push){
        history.push(worldId);
      }
      setBreadcrumb();

      nodes = w.nodes.map(n => ({...n}));
      edges = (w.edges ?? []).map(e => ({...e}));
      byId = new Map(nodes.map(n => [n.id, n]));

      drawWorld();

      // fit inicial
      fitToWorld(450);
    }

    function enterWorld(worldId, fromNodeId){
      // zoom corto hacia el nodo, luego carga mundo
      const n = byId.get(fromNodeId);
      if (!n){ loadWorld(worldId); return; }

      const targetScale = Math.min(5.0, Math.max(currentTransform.k, 2.6));
      const t = d3.zoomIdentity
        .translate(W/2, H/2)
        .scale(targetScale)
        .translate(-(n._x ?? 0), -(n._y ?? 0));

      svg.transition().duration(360).call(zoom.transform, t).on("end", ()=>{
        loadWorld(worldId, {push:true});
      });
    }

    function setBreadcrumb(){
      const parts = history.map(id => WORLDS[id]?.name ?? id);
      hudCrumb.textContent = "Ruta: " + parts.join("  ›  ");
      btnBack.toggleAttribute("disabled", history.length <= 1);
    }

    // =========================
    // MINIMAPA
    // =========================
    const mini = {
      w: 240, h: 160,
      pad: 14,
      scale: 1,
      tx: 0, ty: 0
    };

    miniSvg.attr("viewBox", `0 0 ${mini.w} ${mini.h}`);

    const miniG = miniSvg.append("g");
    miniG.append("rect").attr("class","miniBg").attr("x",0).attr("y",0).attr("width",mini.w).attr("height",mini.h);

    const miniEdgesG = miniG.append("g");
    const miniNodesG = miniG.append("g");

    const miniViewport = miniG.append("rect")
      .attr("class","miniViewport")
      .attr("x", 30).attr("y", 30).attr("width", 60).attr("height", 40);

    // Drag del viewport
    const dragViewport = d3.drag()
      .on("drag", (event)=>{
        // mover rect y ajustar transform de cámara acorde
        const nx = clamp(parseFloat(miniViewport.attr("x")) + event.dx, 0, mini.w);
        const ny = clamp(parseFloat(miniViewport.attr("y")) + event.dy, 0, mini.h);
        miniViewport.attr("x", nx).attr("y", ny);

        // centro del viewport en coords del mundo
        const cxm = nx + parseFloat(miniViewport.attr("width"))/2;
        const cym = ny + parseFloat(miniViewport.attr("height"))/2;
        panToMiniPoint(cxm, cym, 0);
      });

    miniViewport.call(dragViewport);

    // Click en minimapa para pan
    miniSvg.on("click", (event)=>{
      const [x,y] = d3.pointer(event);
      panToMiniPoint(x,y, 250);
    });

    function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

    function computeMiniTransform(){
      // bounds del mundo -> encajar en minimapa
      const b = getBounds();
      const bw = b.maxX - b.minX;
      const bh = b.maxY - b.minY;

      const aw = mini.w - mini.pad*2;
      const ah = mini.h - mini.pad*2;

      const s = Math.min(aw/(bw||1), ah/(bh||1));
      mini.scale = s;

      // transform mundo->mini: (x - minX)*s + pad
      mini.tx = -b.minX * s + mini.pad;
      mini.ty = -b.minY * s + mini.pad;
    }

    function worldToMini(x,y){
      return [x*mini.scale + mini.tx, y*mini.scale + mini.ty];
    }

    function miniToWorld(x,y){
      return [(x - mini.tx)/mini.scale, (y - mini.ty)/mini.scale];
    }

    function updateMiniMap(){
      if (!showMini) return;

      computeMiniTransform();

      // redibuja nodos/edges mini (barato)
      miniEdgesG.selectAll("*").remove();
      miniNodesG.selectAll("*").remove();

      // edges mini (sin LOD; aquí se puede filtrar si quieres)
      for (const e of edges){
        const a = byId.get(e.s), b = byId.get(e.t);
        if (!a || !b) continue;
        const [ax,ay] = worldToMini(a._x ?? a.x ?? 0, a._y ?? a.y ?? 0);
        const [bx,by] = worldToMini(b._x ?? b.x ?? 0, b._y ?? b.y ?? 0);
        miniEdgesG.append("line").attr("class","miniEdge").attr("x1",ax).attr("y1",ay).attr("x2",bx).attr("y2",by);
      }

      // nodos mini
      for (const n of nodes){
        const [mx,my] = worldToMini(n._x ?? n.x ?? 0, n._y ?? n.y ?? 0);
        miniNodesG.append("circle").attr("class","miniNode").attr("cx",mx).attr("cy",my).attr("r", n.kind==="C" ? 3.2 : 2.4);
      }

      // viewport rect: invertimos el transform actual para ver qué parte del mundo está visible
      const k = currentTransform.k;
      const tx = currentTransform.x;
      const ty = currentTransform.y;

      // pantalla -> mundo: xw = (xs - tx)/k
      const leftWorld   = (0 - tx) / k;
      const topWorld    = (0 - ty) / k;
      const rightWorld  = (W - tx) / k;
      const bottomWorld = (H - ty) / k;

      const [lmx,lmy] = worldToMini(leftWorld, topWorld);
      const [rmx,rmy] = worldToMini(rightWorld, bottomWorld);

      const vx = Math.min(lmx, rmx);
      const vy = Math.min(lmy, rmy);
      const vw = Math.abs(rmx - lmx);
      const vh = Math.abs(rmy - lmy);

      miniViewport
        .attr("x", vx).attr("y", vy)
        .attr("width", vw).attr("height", vh);
    }

    function panToMiniPoint(mx,my, duration=250){
      // queremos que (mx,my) quede en el centro de la pantalla
      const [wx,wy] = miniToWorld(mx,my);
      const s = currentTransform.k;

      const t = d3.zoomIdentity
        .translate(W/2, H/2)
        .scale(s)
        .translate(-wx, -wy);

      if (duration <= 0) svg.call(zoom.transform, t);
      else svg.transition().duration(duration).call(zoom.transform, t);
    }

    // =========================
    // UI
    // =========================
    btnBack.addEventListener("click", ()=>{
      if (history.length <= 1) return;
      history.pop();
      const prev = history[history.length-1];
      loadWorld(prev, {push:false});
    });

    btnHome.addEventListener("click", ()=>{
      history = ["main"];
      loadWorld("main", {push:false});
    });

    btnCenter.addEventListener("click", ()=> centerView(350));
    btnFit.addEventListener("click", ()=> fitToWorld(450));

    btnToggleLabels.addEventListener("click", ()=>{
      showLabels = !showLabels;
      btnToggleLabels.textContent = showLabels ? "Aa Etiquetas" : "Aa Etiquetas (off)";
      update();
    });

    btnToggleEdges.addEventListener("click", ()=>{
      showEdges = !showEdges;
      btnToggleEdges.textContent = showEdges ? "— Conexiones" : "— Conexiones (off)";
      update();
    });

    btnToggleMini.addEventListener("click", ()=>{
      showMini = !showMini;
      miniWrap.style.display = showMini ? "block" : "none";
      btnToggleMini.textContent = showMini ? "▣ Minimapa" : "▣ Minimapa (off)";
      update();
    });

    // =========================
    // ANIM LOOP
    // =========================
    let t0 = performance.now();
    function tick(now){
      const t = (now - t0)/1000;
      computePositions(t);
      update();
      requestAnimationFrame(tick);
    }

    // init
    loadWorld("main", {push:false});
    setBreadcrumb();
    requestAnimationFrame(tick);

    // resize
    window.addEventListener("resize", ()=>{
      W = window.innerWidth; H = window.innerHeight;
      drawStars();
      // Mantener transform actual
      viewport.attr("transform", currentTransform);
      update();
    });
  </script>
</body>
</html>

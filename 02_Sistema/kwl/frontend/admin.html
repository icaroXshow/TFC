<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KWL Aqua · Panel Admin</title>
  <link rel="icon" href="./assets/img/logo_kwl.png" type="image/png">
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body class="site-body">
  <header class="topbar">
    <div class="topbar-main container">
      <a class="brand" href="./admin.html">
        <img src="./assets/img/logo_kwl.png" alt="KWL Aqua" class="brand-logo">
        <span class="brand-title">KWL AQUA · ADMIN</span>
      </a>
      <div class="header-actions">
        <span id="sessionUser" class="pill">--</span>
        <button id="logoutBtn" class="btn btn--danger">Cerrar sesion</button>
      </div>
    </div>

    <nav class="topnav">
      <a class="topnav-link topnav-link--active" href="./admin.html">Panel</a>
      <a class="topnav-link" href="./index.html">Landing</a>
    </nav>
  </header>

  <main class="container panel-layout">
    <section class="card panel-health">
      <div class="row">
        <h2>Salud general</h2>
        <div class="actions">
          <button id="refreshNow" class="btn">Actualizar</button>
          <button id="toggleAuto" class="btn btn--light">Auto: ON</button>
        </div>
      </div>
      <p id="healthText" class="muted">Cargando estado...</p>
    </section>

    <section class="panel-grid">
      <section class="card">
        <div class="row">
          <h2>Sistema local</h2>
          <span class="pill" id="systemStatus">Sin datos</span>
        </div>
        <p id="doorState" class="muted">Puerta: --</p>
        <p id="lightState" class="muted">Luz: --</p>
        <div class="actions">
          <button id="doorOpen" class="btn">Abrir puerta</button>
          <button id="doorClose" class="btn btn--warn">Cerrar puerta</button>
          <button id="lightOn" class="btn">Luz ON</button>
          <button id="lightOff" class="btn btn--danger">Luz OFF</button>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <h2>Eventos recientes</h2>
          <span class="pill" id="eventsCount">0</span>
        </div>
        <ul id="eventsList" class="log-list"></ul>
      </section>
    </section>

    <section class="card">
      <div class="row">
        <h2>Maquinas</h2>
        <span class="pill" id="machinesCount">0</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Codigo</th>
              <th>Tipo</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="machinesBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer footer--compact">
    <div class="footer-copy">© 2026 KWL Aqua. Panel de administracion.</div>
  </footer>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
